<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>静驻 · 白瓷科幻 UIUX · 独立页面审阅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#26323a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}button,a{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:274px;background:#f8fafb;border-right:1px solid #dfe6eb;padding:28px 16px;overflow:auto}h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:30px;letter-spacing:5px;font-weight:400;margin:0 15px 8px}.edition{font-size:10px;letter-spacing:3px;color:#61727d;margin:0 15px 30px}.nav{border:0;background:transparent;width:100%;text-align:left;display:flex;gap:12px;padding:12px;border-radius:12px;margin:3px 0;align-items:center;color:#64747e}.nav.active{background:#e5edf3;color:#263b49}.nav span{font-size:11px;width:20px}.nav b{font-weight:400;font-size:12px;line-height:1.6}.sidefoot{padding:20px 12px;color:#61727d;font-size:11px;line-height:1.8}main{margin-left:274px}header{min-height:100px;display:flex;justify-content:space-between;gap:20px;padding:24px 32px;background:#fafcfc;border-bottom:1px solid #dfe6eb;align-items:center}h2{font-size:20px;font-weight:500;margin:0 0 9px}.sub{font-size:12px;color:#64747e}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button,.actions a{border:1px solid #d7e1e7;border-radius:22px;background:white;color:#354b59;padding:10px 16px;text-decoration:none;font-size:12px}.actions button.selected{background:#334650;color:white;border-color:#334650}.stage{padding:28px;min-height:calc(100vh - 150px);display:flex;align-items:flex-start;justify-content:center;overflow:auto}.stage img{display:block;max-width:100%;max-height:calc(100vh - 168px);width:auto;height:auto;box-shadow:0 15px 60px #a4b4c426}.stage.native{justify-content:flex-start}.stage.native img{max-width:none;max-height:none;flex-shrink:0}footer{padding:0 32px 22px;color:#657782;font-size:12px;line-height:1.8}button:focus-visible,a:focus-visible{outline:3px solid #7a9fba;outline-offset:2px}@media(max-width:900px){aside{width:215px;padding:18px 10px}main{margin-left:215px}header{display:block;padding:18px}.actions{margin-top:16px}.stage{padding:16px}.stage img{max-height:calc(100vh - 240px)}}@media(max-width:600px){aside{position:static;width:100%;max-height:220px}main{margin:0}.edition{margin-bottom:10px}.nav{display:inline-flex;width:auto}.nav b{font-size:11px}.sidefoot{display:none}.stage img{max-height:none}}
</style></head><body><aside><h1>静驻</h1><div class="edition">PORCELAIN / WHITE EDITION</div><button class="nav" type="button" data-i="0"><span>01</span><b>此刻 · 时间主权</b></button><button class="nav" type="button" data-i="1"><span>02</span><b>时间账本 · 责任与边界</b></button><button class="nav" type="button" data-i="2"><span>03</span><b>收件箱 · 请求不等于承诺</b></button><button class="nav" type="button" data-i="3"><span>04</span><b>自适应方案 · 改变方法与分工</b></button><button class="nav" type="button" data-i="4"><span>05</span><b>变更预览 · 有限授权</b></button><button class="nav" type="button" data-i="5"><span>06</span><b>协同工作台 · 有来源的草稿</b></button><button class="nav" type="button" data-i="6"><span>07</span><b>工作现场 · 恢复下一步</b></button><button class="nav" type="button" data-i="7"><span>08</span><b>静驻时刻 · 不安排也成立</b></button><button class="nav" type="button" data-i="8"><span>09</span><b>注意力队列 · 同一份预算</b></button><button class="nav" type="button" data-i="9"><span>10</span><b>我的边界 · 权限与暂停</b></button><button class="nav" type="button" data-i="10"><span>11</span><b>私人上下文 · 来源与推测</b></button><button class="nav" type="button" data-i="11"><span>12</span><b>时间回顾 · 收益不做假账</b></button><button class="nav" type="button" data-i="12"><span>13</span><b>同步异常 · 未知与接管</b></button><button class="nav" type="button" data-i="13"><span>14</span><b>快捷输入 · 意图与约束</b></button><button class="nav" type="button" data-i="14"><span>15</span><b>移动端 · 此刻</b></button><button class="nav" type="button" data-i="15"><span>16</span><b>移动端 · 自适应方案</b></button><button class="nav" type="button" data-i="16"><span>17</span><b>移动端 · 一次性授权</b></button><button class="nav" type="button" data-i="17"><span>18</span><b>移动端 · 静驻时刻</b></button><div class="sidefoot">14 张桌面 4K 大图<br>4 张移动端 3× 大图<br><br>← → 切换页面<br>F 适合窗口 / 1 原尺寸<br><br>所有图片为独立页面。<br>图中操作按钮是静态设计，<br>不会修改真实账户。</div></aside><main><header><div><h2 id="title"></h2><div class="sub" id="meta"></div></div><div class="actions"><button id="prev" aria-label="上一页">←</button><button id="next" aria-label="下一页">→</button><button id="fit" class="selected">适合窗口</button><button id="native">100%</button><a id="open" href="#" target="_blank" rel="noopener">打开原图 ↗</a></div></header><div class="stage" id="stage"><img id="screen" alt=""></div><footer id="description"></footer></main><script>
const items=[{"id": 1, "name": "此刻_时间主权", "description": "首页以要保护的一段时间为主对象，显示容量冲突与一个需要用户决定的问题。", "path": "01_桌面大图/01_此刻_时间主权.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 2, "name": "时间账本_责任与边界", "description": "日历以责任和边界两条轨道呈现：19:00 的容量冲突可见，静驻不能被自动侵占。", "path": "01_桌面大图/02_时间账本_责任与边界.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 3, "name": "收件箱_请求不等于承诺", "description": "从原话、来源与未知字段到用户接受，明确区分请求、意图与已接受责任。", "path": "01_桌面大图/03_收件箱_请求不等于承诺.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 4, "name": "自适应方案_改变方法与分工", "description": "并排比较减负与延期，对20分钟预计减少和40分钟未来负担分别记账。", "path": "01_桌面大图/04_自适应方案_改变方法与分工.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 5, "name": "变更预览_有限授权", "description": "对象级前后差异、一次性授权、计划版本绑定、不可逆外部动作的排除范围。", "path": "01_桌面大图/05_变更预览_有限授权.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 6, "name": "协同工作台_有来源的草稿", "description": "正文优先的文档工作台，AI准备与用户判断并置，缺失依据和未发送状态始终可见。", "path": "01_桌面大图/06_协同工作台_有来源的草稿.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 7, "name": "工作现场_恢复下一步", "description": "检查点带回已确认事实、未决问题和关联材料，支持更换参与方式而非重复建立计划。", "path": "01_桌面大图/07_工作现场_恢复下一步.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 8, "name": "静驻时刻_不安排也成立", "description": "开放时间的全屏安静界面，不设倒计时、绩效或连续使用指标，保留不安排这一正常选择。", "path": "01_桌面大图/08_静驻时刻_不安排也成立.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 9, "name": "注意力队列_同一份预算", "description": "真实期限、后果与注意力预算共同约束提醒，AI的内部建议不享有绕过规则的特权。", "path": "01_桌面大图/09_注意力队列_同一份预算.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 10, "name": "我的边界_权限与暂停", "description": "可读、可准备、需确认、未授权分级，规则变更记录与立即暂停路径可达。", "path": "01_桌面大图/10_我的边界_权限与暂停.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 11, "name": "私人上下文_来源与推测", "description": "明确表达的方向与AI假设分层；数据来源覆盖、撤销和导出能力透明。", "path": "01_桌面大图/11_私人上下文_来源与推测.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 12, "name": "时间回顾_收益不做假账", "description": "把保留时段、延期负担和AI管理成本分开展示，不伪造反事实净节省或人生评分。", "path": "01_桌面大图/12_时间回顾_收益不做假账.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 13, "name": "同步异常_未知与接管", "description": "完整设计部分同步失败：本地保护与外部忙闲分开，允许重新核验、原工具接管和降级。", "path": "01_桌面大图/13_同步异常_未知与接管.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 14, "name": "快捷输入_意图与约束", "description": "一句话被拆成意图与硬边界；执行前做冲突检查，不从口语输入推导泛化授权。", "path": "01_桌面大图/14_快捷输入_意图与约束.png", "width": 3840, "height": 2400, "mobile": false}, {"id": 15, "name": "移动端_此刻", "description": "手机首页把一段时间和一个决定放在首屏，关键控制有明确文字而不是只有图标。", "path": "02_移动端大图/15_移动端_此刻.png", "width": 1440, "height": 3120, "mobile": true}, {"id": 16, "name": "移动端_自适应方案", "description": "手机上的方案选择保留估计、管理成本和未来负担，固定底部动作进入预览而不是直接执行。", "path": "02_移动端大图/16_移动端_自适应方案.png", "width": 1440, "height": 3120, "mobile": true}, {"id": 17, "name": "移动端_一次性授权", "description": "移动端的明确授权面板，可操作范围与排除项同屏，批准之前所有动作仍未执行。", "path": "02_移动端大图/17_移动端_一次性授权.png", "width": 1440, "height": 3120, "mobile": true}, {"id": 18, "name": "移动端_静驻时刻", "description": "手机安静界面只有一个主动作，无绩效、倒计时或连续打卡压力，边界覆盖明确。", "path": "02_移动端大图/18_移动端_静驻时刻.png", "width": 1440, "height": 3120, "mobile": true}];let current=0;const byId=id=>document.getElementById(id);function render(i){current=(i+items.length)%items.length;const x=items[current];byId('title').textContent=String(x.id).padStart(2,'0')+' / '+x.name.replaceAll('_',' · ');byId('meta').textContent=x.width+' × '+x.height+' px · PNG · '+(x.mobile?'移动端':'桌面端')+' · '+(current+1)+' / '+items.length;byId('screen').src=x.path;byId('screen').alt=x.name+'：'+x.description;byId('open').href=x.path;byId('description').textContent=x.description;document.querySelectorAll('.nav').forEach((el,j)=>el.classList.toggle('active',j===current));document.title='静驻 · '+x.name;location.hash='page-'+x.id}function fit(on){byId('stage').classList.toggle('native',!on);byId('fit').classList.toggle('selected',on);byId('native').classList.toggle('selected',!on)}document.querySelectorAll('.nav').forEach(el=>el.onclick=()=>render(Number(el.dataset.i)));byId('prev').onclick=()=>render(current-1);byId('next').onclick=()=>render(current+1);byId('fit').onclick=()=>fit(true);byId('native').onclick=()=>fit(false);window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')render(current+1);if(e.key==='ArrowLeft')render(current-1);if(e.key.toLowerCase()==='f')fit(true);if(e.key==='1')fit(false)});const start=parseInt(location.hash.replace('#page-',''))||1;render(Math.max(0,items.findIndex(x=>x.id===start)));
</script></body></html>
