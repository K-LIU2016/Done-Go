<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- LEUBAI:BODY-START -->
<title>留白 LeuBai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: three screens (今天 / 时间线 / 回顾). One big number, one mic, one blank block. Phone: bottom tabs; ≥1100px: side rail. */
:root {
  --bg: #EEF3EC;
  --surface: #FFFFFF;
  --text: #22302A;
  --text-2: #5C6B61;
  --line: rgba(34, 48, 42, .14);
  --accent: #3E5A47;
  --warm: #8A5A2B;
  --k-nec: #7D8781;
  --k-restore: #4F8570;
  --k-create: #B07A36;
  --k-connect: #B05A4D;
  --k-explore: #4D7699;
  --k-blank: #6E7E72;
  --spring: #EEF0BE;
  --haze: #8C9FB1;
  --spring-ink: #2F3B26;
  --moss: #8DA48E;
  --moss-line: #7F977F;
  --deep: #2E4636;
  --paper: #FCFBF6;
  --font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #5F7363; --surface: #6C8170; --text: #F3F1E6; --text-2: #DCE3D8; --line: rgba(243, 241, 230, .18); --accent: #EEF0BE; --warm: #F0C987; --moss: #7F977F; --moss-line: #92A892; --deep: #22352A; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #5F7363; --surface: #6C8170; --text: #F3F1E6; --text-2: #DCE3D8; --line: rgba(243, 241, 230, .18); --accent: #EEF0BE; --warm: #F0C987; --moss: #7F977F; --moss-line: #92A892; --deep: #22352A; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2 { font-family: var(--font-serif); font-weight: 400; margin: 0; }
h2 { font-size: 17px; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--font-serif); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-inline: 20px; padding-block: 0 110px; }
.top { padding-block: 18px 6px; }
.logo { font-family: var(--font-serif); font-size: 22px; letter-spacing: .12em; text-decoration: none; }
.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 18px; }
.foot { display: flex; justify-content: flex-end; padding-block: 40px 0; }
.foot a { font-size: 13px; color: var(--text-2); text-decoration: none; }
.foot a[aria-current="page"] { color: var(--text); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); z-index: 20; }
.tabs a { flex: 0 1 120px; text-align: center; padding: 8px 0; border-radius: 999px; text-decoration: none; color: var(--text-2); font-size: 14px; }
.tabs a[aria-current="page"] { color: var(--bg); background: var(--text); }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14.5px; text-decoration: none; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.sm { min-height: 34px; padding: 0 14px; font-size: 13.5px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; }
.x { border: 0; background: none; color: var(--text-2); cursor: pointer; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; }

/* Today */
.hello { color: var(--text-2); font-size: 14px; }
.big { font-family: var(--font-serif); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-family: var(--font-sans); font-size: 16px; color: var(--text-2); margin: 0 .25em 0 .1em; }
.label { font-size: 13px; color: var(--text-2); letter-spacing: .08em; }
.voice { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 14px; padding: 26px 18px 18px; background: linear-gradient(160deg, #F6F6D2, var(--spring)); color: var(--spring-ink); border: 0; border-radius: 28px;
  --text: var(--spring-ink); --text-2: #5F6B50; --line: rgba(47, 59, 38, .14); --bg: rgba(255, 255, 255, .65); --surface: #FFFFFF; }
.voice .mic, .voice .say button, .voice .btn.primary { background: var(--deep); color: var(--spring); border-color: var(--deep); }
.mic { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); display: grid; place-items: center; cursor: pointer; position: relative; }
.mic svg { width: 32px; height: 32px; }
.mic.on { background: var(--k-connect); }
.mic.on::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--k-connect); animation: pulse 1.2s ease-out infinite; }
@keyframes pulse { from { transform: scale(.9); opacity: .7; } to { transform: scale(1.18); opacity: 0; } }
.say { width: 100%; display: flex; gap: 8px; }
.say input { flex: 1; min-width: 0; min-height: 46px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.say button { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); cursor: pointer; font-size: 18px; }
.status { font-size: 13px; color: var(--text-2); text-align: center; }
.status.warn { color: var(--warm); }
.status:empty { display: none; }

.drafts { width: 100%; display: grid; gap: 2px; }
.draft { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.draft .t { min-width: 0; }
.draft .t input { width: 100%; border: 0; background: none; padding: 0; font-size: 15px; }
.draft .times { display: flex; gap: 4px; align-items: center; font-size: 12.5px; color: var(--text-2); }
.draft .times input { border: 0; background: none; padding: 0; font-size: 12.5px; color: var(--text-2); width: 3.2em; font-variant-numeric: tabular-nums; }
.draft.bad .times input { color: var(--warm); }
.kind { border: 0; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: #fff; }
.kind.blank { background: transparent !important; color: var(--text-2); border: 1.5px dashed var(--k-blank); }

.blank-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border: 1.5px dashed var(--k-blank); border-radius: 20px; }
.blank-card.ask { border: 0; padding: 2px 4px; border-radius: 0; }
.blank-card .when { font-family: var(--font-serif); font-size: 20px; }

.saved { margin-top: 6px; font-size: 13.5px; color: var(--k-restore); }
.plan-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.plan { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.plan:last-child { border-bottom: 0; }
.plan .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; }
.plan .t small { display: block; font-size: 12px; color: var(--text-2); }
.plan.over { opacity: .45; }
.ai-tip .btn { white-space: nowrap; flex: none; }
.ai-tip { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.ai-tip b { font-weight: 500; color: var(--k-restore); }
.ai-tip.done { display: block; border-style: dashed; }
.ai-mini { color: var(--k-restore); margin-left: 6px; white-space: nowrap; }

.picker { border: 2px solid var(--deep); border-radius: 26px; padding: 18px 16px; }
.avs { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
.tile-av { display: grid; justify-items: center; gap: 1px; padding: 8px 0 7px; border: 1.5px solid rgba(34, 48, 42, .18); background: var(--paper); color: #1F2622; cursor: pointer; transition: transform .12s; }
.tile-av .av { display: block; width: 40px; height: 40px; }
.ink { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ink .f { fill: currentColor; stroke: none; }
.tile-av { position: relative; }
.tile-av .clk { position: absolute; top: 5px; right: 6px; width: 14px; height: 14px; color: #6A746D; }
.pick-tip { margin: 0 0 10px; padding: 0 4px; color: var(--text-2); font-size: 14px; }
.tile-av:active { transform: scale(.94); }
.tile-av.on { border-color: var(--deep); background: var(--spring); box-shadow: 0 0 0 2px var(--deep); transform: rotate(-3deg); }
.tile-av.busy { opacity: .4; }
.tile-av.busy.on { opacity: 1; }
.tile-av.kept { border-style: dashed; border-color: var(--k-blank); opacity: .7; cursor: default; }

.clash { display: grid; justify-items: center; gap: 12px; text-align: center; }
.clash h2 { font-size: 21px; }
.clash p { max-width: 30em; }
.oops { width: 84px; height: 84px; color: var(--text); animation: wobble .6s ease-in-out 1; }
.oops .drop { color: var(--k-explore); stroke: var(--k-explore); animation: drip 1.4s ease-in .4s infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 60% { transform: rotate(6deg); } }
@keyframes drip { 0% { transform: translateY(0); opacity: 1; } 80% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
.clash-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--text); }
@media (prefers-reduced-motion: reduce) { .oops, .oops .drop { animation: none; } }

:root { --p1: #D9483E; --p2: #E5714A; --p3: #EFA05E; --p4: #D8C29C; --p5: #BFC6CB; --field: var(--moss); --field-line: var(--moss-line); }
.bubbles { position: relative; height: 380px; overflow: hidden; touch-action: none; }
.bubbles .axes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; color: var(--deep); }
.bubble { position: absolute; left: 0; top: 0; display: grid; place-content: center; gap: 1px; text-align: center; border: 0; padding: 0 3px; cursor: grab; color: #fff; background: none; user-select: none; -webkit-user-select: none; will-change: transform; isolation: isolate; transition: opacity .4s; }
.bubble::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; animation: cell 5s ease-in-out infinite alternate, spin 14s linear infinite;
  box-shadow: inset -7px -9px 16px rgba(0,0,0,.10), 0 8px 18px rgba(120,70,30,.12); }
.bubble:nth-child(2n)::before { animation-duration: 6.5s, 18s; animation-delay: -2s, -6s; animation-direction: alternate, reverse; }
.bubble:nth-child(3n)::before { animation-duration: 4.2s, 11s; animation-delay: -3s, -2s; }
.bubble:active { cursor: grabbing; }
.bubble .bt { font-weight: 500; line-height: 1.2; white-space: nowrap; letter-spacing: -.02em; }
.bubble .bs { font-size: .78em; opacity: .85; font-variant-numeric: tabular-nums; }
.bubble.p1::before { background: radial-gradient(circle at 32% 28%, #F59A8E, var(--p1) 68%); }
.bubble.p2::before { background: radial-gradient(circle at 32% 28%, #F6A585, var(--p2) 68%); }
.bubble.p3::before { background: radial-gradient(circle at 32% 28%, #F9CFA3, var(--p3) 68%); }
.bubble.p4::before { background: radial-gradient(circle at 32% 28%, #F3E7CF, var(--p4) 70%); }
.bubble.p5::before { background: radial-gradient(circle at 32% 28%, #ECEFF1, var(--p5) 70%); }
.bubble.pb::before { background: radial-gradient(circle at 32% 28%, #D3DDE6, var(--haze) 70%); }
.bubble.pb { color: #fff; }
.bub-empty { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; color: var(--text-2); font-size: 14px; pointer-events: none; }
.bubble.p3 { opacity: .92; }
.bubble.p4 { color: #4E4634; opacity: .85; }
.bubble.p5 { color: #4A545B; opacity: .75; }
.bubble.sel { opacity: 1; z-index: 2; }
.bubble.sel::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px dashed var(--deep); animation: spin 8s linear infinite; }
.selbar { display: grid; gap: 10px; padding: 12px 14px; border-radius: 20px; background: var(--surface); }
.sel-name { font-size: 15px; }
.sel-name .pdot { font-style: normal; margin-right: 4px; }
.sel-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.sel-btns .btn { flex: 1 0 auto; }
.bubble.over { opacity: .3; filter: grayscale(.6); }
.bubble.pop::before { animation: pop .45s ease-out, cell 5s ease-in-out infinite alternate, spin 14s linear infinite; }
@keyframes cell {
  0% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; transform: scale(1, 1); }
  33% { border-radius: 63% 37% 41% 59% / 58% 63% 37% 42%; transform: scale(1.05, .95); }
  66% { border-radius: 35% 65% 55% 45% / 62% 38% 62% 38%; transform: scale(.96, 1.04); }
  100% { border-radius: 56% 44% 34% 66% / 45% 57% 43% 55%; transform: scale(1.03, .98); } }
@keyframes spin { to { rotate: 360deg; } }
@keyframes pop { 0% { scale: 1; } 35% { scale: 1.18; } 100% { scale: 1; } }
.bub-hint { text-align: center; }
.pdot { border: 0; border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: #fff; white-space: nowrap; }
.pdot.p1, .pchip.p1[aria-pressed="true"] { background: var(--p1); color: #fff; border-color: var(--p1); }
.pdot.p2, .pchip.p2[aria-pressed="true"] { background: var(--p2); color: #fff; border-color: var(--p2); }
.pdot.p3, .pchip.p3[aria-pressed="true"] { background: var(--p3); color: #fff; border-color: var(--p3); }
.pdot.p4, .pchip.p4[aria-pressed="true"] { background: var(--p4); color: #4E4634; border-color: var(--p4); }
.pdot.p5, .pchip.p5[aria-pressed="true"] { background: var(--p5); color: #4A545B; border-color: var(--p5); }
@media (min-width: 1100px) { .bubbles { height: 440px; } }
@media (prefers-reduced-motion: reduce) { .bubble::before { animation: none !important; } }
@media (min-width: 1100px) { .bubbles { height: 440px; } }

.forest { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; color: #D3DFCF; }
.app { position: relative; z-index: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .forest { color: #536853; } }
:root[data-theme="dark"] .forest { color: #536853; }
.tree-bg { position: absolute; right: -60px; bottom: -40px; width: min(420px, 70vw); height: auto; opacity: .55; }
.sway { transform-origin: 150px 420px; animation: sway 7s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-2.2deg); } to { transform: rotate(2.4deg); } }
.leaf-f { position: absolute; top: -40px; width: 16px; height: 9px; border-radius: 0 100% 0 100%; background: #8FA88A; opacity: .5; animation: fall linear infinite; }
.leaf-f:nth-child(2n) { background: #C2A35F; width: 13px; height: 8px; }
.leaf-f:nth-child(3n) { background: #8FA88A; }
@keyframes fall {
  0% { transform: translate(0, 0) rotate(0); }
  25% { transform: translate(40px, 25vh) rotate(120deg); }
  50% { transform: translate(-20px, 50vh) rotate(220deg); }
  75% { transform: translate(35px, 75vh) rotate(320deg); }
  100% { transform: translate(-10px, 110vh) rotate(420deg); } }
@media (prefers-reduced-motion: reduce) { .sway, .leaf-f { animation: none; } .leaf-f { display: none; } }

/* Timeline */
.daynav { display: flex; align-items: center; justify-content: space-between; }
.daynav button { border: 0; background: none; font-size: 22px; width: 44px; height: 44px; cursor: pointer; color: var(--text-2); }
.daynav span { font-family: var(--font-serif); font-size: 20px; }
.tree-wrap { position: relative; max-width: 520px; width: 100%; margin: 0 auto; }
.tree { display: block; width: 100%; height: auto; overflow: visible; }
.tree .hr { font-size: 10.5px; fill: var(--text-2); font-variant-numeric: tabular-nums; }
.tree .lt { font-size: 13px; fill: var(--text); font-family: var(--font-sans); }
.tree .ls { font-size: 10.5px; fill: var(--text-2); font-variant-numeric: tabular-nums; }
.tree .spark { font-size: 11px; fill: var(--warm); }
.tree .leaf { cursor: pointer; transition: opacity .2s; }
.tree .leaf.future { opacity: .62; }
.tree .leaf:hover, .tree .leaf:focus-visible { opacity: 1; outline: none; }
.tree .leaf:focus-visible .lt { text-decoration: underline; }
.tree-wrap .empty { position: absolute; left: 0; right: 0; top: 40%; }
.tree-key { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-2); }
.tree-key i { width: 4px; height: 16px; border-radius: 2px; }
.empty { text-align: center; color: var(--text-2); padding: 36px 0; }

/* Review */
.seg { display: inline-flex; gap: 4px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; justify-self: start; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; cursor: pointer; font-size: 13.5px; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.block { display: grid; gap: 12px; }
.stack-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.legend b { font-weight: 400; color: var(--text); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 4px; }
.tile .v { font-family: var(--font-serif); font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .v small { font-family: var(--font-sans); font-size: 13px; color: var(--text-2); margin-left: .2em; }
.ai-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ai-row:last-child { border-bottom: 0; }

/* Settings + sheets */
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--text-2); }
.field input, .field textarea, .field select { min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); width: 100%; }
.field textarea { min-height: 100px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 17, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet { width: min(480px, 100%); background: var(--surface); border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 18px; border-radius: 999px; font-size: 13.5px; z-index: 60; }

@media (min-width: 720px) {
  .app { max-width: 640px; }
  .big { font-size: 76px; }
  .overlay { align-items: center; }
  .sheet { border-radius: 24px; }
}
@media (min-width: 1100px) {
  body { padding-left: 120px; }
  .app { max-width: 980px; padding-inline: 48px; padding-block: 0 48px; }
  .tabs { top: 0; right: auto; width: 120px; flex-direction: column; justify-content: flex-start; padding: 84px 14px; border-top: 0; border-right: 1px solid var(--line); background: var(--bg); }
  .tabs a { flex: none; }
  .page.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 48px; align-items: start; }
  .page.split > .full { grid-column: 1 / -1; }
  .col { display: grid; gap: 28px; align-content: start; }
  .toast { bottom: 32px; }
}
.col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-content: start; min-width: 0; }
@media (prefers-reduced-motion: reduce) { .mic.on::after { animation: none; } }
</style>

<div class="forest" aria-hidden="true">

<script>
(function () {
  'use strict';

  var KINDS = {
    necessary: { label: '必要', color: 'var(--k-nec)' },
    restore: { label: '恢复', color: 'var(--k-restore)' },
    create: { label: '创造', color: 'var(--k-create)' },
    connect: { label: '连接', color: 'var(--k-connect)' },
    explore: { label: '探索', color: 'var(--k-explore)' },
    blank: { label: '留白', color: 'var(--k-blank)' }
  };
  var KIND_ORDER = ['necessary', 'create', 'connect', 'explore', 'restore', 'blank'];
  var QUADS = ['restore', 'create', 'connect', 'explore'];
  var PAGES = [{ id: 'today', label: '今天' }, { id: 'line', label: '时间线' }, { id: 'review', label: '回顾' }];
  var STORE_KEY = 'leubai.web.v1';
  var RULES = [
    { re: /读论文|看论文|读文献|看文献|论文阅读|阅读文献|读报告|看报告/, low: 0.7, high: 0.9, method: 'AI 先读，给你摘要和要点' },
    { re: /修改|改稿|润色|校对|写论文|写报告/, low: 0.2, high: 0.4, method: 'AI 帮你润色、查错' },
    { re: /邮件|email|回复|消息/i, low: 0.3, high: 0.55, method: 'AI 起草，你来改' },
    { re: /会议|纪要|组会|周会|例会|开会/, low: 0.3, high: 0.6, method: '自动纪要' },
    { re: /论文|文献|筛选|初筛|材料|审稿/, low: 0.3, high: 0.6, method: 'AI 摘要初筛' },
    { re: /报销|行政|表格|填报|审批|整理|申请/, low: 0.2, high: 0.45, method: '自动填表' },
    { re: /批改|作业|出题/, low: 0.2, high: 0.4, method: 'AI 初评' },
    { re: /通勤|路上|排队/, low: 0, high: 0, method: '难以压缩' }
  ];
  var DEFAULT_RULE = { low: 0.1, high: 0.3, method: '先记一周再看' };

  // keyword → kind, checked in order; the first hit wins
  var KIND_WORDS = [
    ['blank', /留白|空出|空着|什么都不(做|安排)|不安排/],
    ['connect', /陪|家人|朋友|父母|爸|妈|女儿|儿子|孩子|老婆|老公|伴侣|聊天|聚餐|吃饭|打电话|电话|约会|见面/],
    ['restore', /睡|午休|散步|休息|跑步|运动|健身|游泳|瑜伽|冥想|发呆|洗澡|按摩/],
    ['necessary', /会|邮件|回复|报销|行政|审稿|批改|作业|上课|讲课|答疑|通勤|填|申请|汇报|材料|文献筛选|初筛|家务|买菜|消息/],
    ['create', /写|撰写|画|创作|设计|编程|代码|作曲|拍|做研究|实验/],
    ['explore', /读|看书|阅读|学|课程|纪录片|看展|展览|逛|旅行|探索|播客/]
  ];
  function guessKind(s) { for (var i = 0; i < KIND_WORDS.length; i++) if (KIND_WORDS[i][1].test(s)) return KIND_WORDS[i][0]; return 'necessary'; }

  // ---------- utils ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function addDays(s, n) { var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + n); return ymd(d); }
  function toMin(t) { var p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); }
  function toHM(m) { m = Math.max(0, Math.min(1440, Math.round(m))); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function isHM(t) { return typeof t === 'string' && /^([01]\d|2[0-4]):[0-5]\d$/.test(t); }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function dur(e) { var a = toMin(e.start), b = toMin(e.end); return b > a ? b - a : 0; }
  function fmt(m) {
    m = Math.max(0, Math.round(m)); var h = Math.floor(m / 60), r = m % 60;
    if (!h) return '<span class="num">' + r + '</span><small>分钟</small>';
    return '<span class="num">' + h + '</span><small>小时</small>' + (r ? '<span class="num">' + r + '</span><small>分</small>' : '');
  }
  function fmtPlain(m) { m = Math.max(0, Math.round(m)); var h = Math.floor(m / 60), r = m % 60; return h ? h + ' 小时' + (r ? ' ' + r + ' 分' : '') : r + ' 分钟'; }
  function pct(x) { return Math.round(x * 100); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function dateLabel(s) {
    var t = todayStr();
    if (s === t) return '今天'; if (s === addDays(t, -1)) return '昨天'; if (s === addDays(t, 1)) return '明天';
    var p = s.split('-'); return (+p[1]) + '月' + (+p[2]) + '日';
  }
  function weekday(s) { var p = s.split('-'); return '日一二三四五六'.charAt(new Date(+p[0], +p[1] - 1, +p[2]).getDay()); }
  function hashInt(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  // AI estimate for one entry: minutes still needed with AI (midpoint of the rule's range, rounded to 5)
  function aiPlan(e) {
    if (e.kind === 'blank' || e.ai) return null;
    var r = ruleFor(e.title), d = dur(e);
    if (r === DEFAULT_RULE || !r.high || d < 20) return null;
    var after = Math.max(5, Math.round(d * (1 - (r.low + r.high) / 2) / 5) * 5);
    return after < d ? { before: d, after: after, saved: d - after, method: r.method } : null;
  }
  function ruleFor(title) { for (var i = 0; i < RULES.length; i++) if (RULES[i].re.test(title)) return RULES[i]; return DEFAULT_RULE; }

  // ---------- state ----------
  var memoryOnly = false;
  function blankState() { return { v: 1, pv: 5, mode: null, name: '', wake: 960, ideal: null, entries: [], trials: [], drafts: [], sortBy: 'prio' }; }
  function load() {
    try { var raw = localStorage.getItem(STORE_KEY); if (raw) { var s = JSON.parse(raw); if (s && s.v === 1) { s.drafts = s.drafts || []; s.sortBy = s.sortBy || 'prio'; if (!s.pv) { s.entries.concat(s.drafts).forEach(function (e) { if (e.prio) e.prio = { 1: 1, 2: 3, 3: 5 }[e.prio] || 3; }); s.pv = 5; } return s; } } } catch (e) { memoryOnly = true; }
    return blankState();
  }
  var S = load();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { memoryOnly = true; } }

  // ---------- demo ----------
  function demoState() {
    var s = blankState(); s.mode = 'demo'; s.name = 'Yajing';
    var t = todayStr(), E = [];
    function add(day, a, b, title, kind, extra) {
      var e = { id: uid(), date: addDays(t, day), start: a, end: b, title: title, kind: kind };
      if (extra) for (var k in extra) e[k] = extra[k];
      E.push(e);
    }
    for (var d = -20; d <= 0; d++) {
      var date = addDays(t, d), p = date.split('-'), wd = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
      var v = hashInt(date) % 4;
      if (d === 0) {
        var n0 = Math.floor(nowMin() / 60) * 60, plan = [[-120, 60, '组会', 'necessary', 3], [60, 120, '读论文', 'explore', 1], [180, 40, '邮件回复', 'necessary', 5], [240, 60, '晚饭', 'connect', 3], [300, 90, '健身', 'restore', 4], [400, 60, '给妈妈打电话', 'connect', 2]];
        plan.forEach(function (x) { var a = n0 + x[0]; if (a >= 420 && a + x[1] <= 1440) add(0, toHM(a), toHM(a + x[1]), x[2], x[3], { prio: x[4] }); });
      } else if (wd !== 0 && wd !== 6) {
        add(d, '09:00', '10:00', '组会', 'necessary');
        add(d, '10:00', '11:30', '读论文', 'explore');
        add(d, '11:30', '12:10', '邮件回复', 'necessary');
        add(d, '13:00', v === 0 ? '14:00' : '15:00', '课程设计', 'create');
        if (v !== 0) add(d, '15:10', '16:10', '文献筛选', 'necessary');
        add(d, '16:20', '17:00', '邮件回复', 'necessary');
        if (v === 2) add(d, '17:00', '17:40', '报销与行政', 'necessary');
        add(d, '18:00', '19:20', '晚餐与聊天', 'connect');
        if (v === 1) add(d, '21:00', '21:40', '夜里散步', 'restore');
        if (v === 3) add(d, '20:30', '21:30', '学一门新课程', 'explore');
      } else {
        add(d, '09:30', '11:30', '陪女儿去公园', 'connect');
        add(d, '14:00', '15:30', '写自己的文章', 'create');
        add(d, '15:30', '16:30', '午后小睡', 'restore');
        add(d, '19:00', '20:30', '和朋友吃饭', 'connect');
      }
    }
    add(-1, '19:40', '21:28', '留白', 'blank', { state: 'kept', kept: 108, use: 'connect', note: '陪女儿散步' });
    add(-3, '19:30', '21:00', '留白', 'blank', { state: 'partial', kept: 60, use: 'restore', note: '后半段回了几封工作消息' });
    add(-6, '20:00', '21:00', '留白', 'blank', { state: 'taken', kept: 0, use: null, note: '临时加了一个会' });
    add(-9, '19:30', '20:30', '留白', 'blank', { state: 'kept', kept: 60, use: 'blank', note: '' });
    add(-13, '20:00', '21:30', '留白', 'blank', { state: 'kept', kept: 90, use: 'create', note: '画了两页速写' });
    if (!E.some(function (e) { return e.date === t && toMin(e.start) < 1320 && toMin(e.end) > 1260; })) add(0, '21:00', '22:00', '留白', 'blank', { state: 'reserved', kept: 0, use: null, note: '', intent: '' });
    s.entries = E;
    s.trials = [
      { id: uid(), date: addDays(t, -1), title: '邮件回复', before: 54, after: 19, method: 'AI 起草常规回复' },
      { id: uid(), date: addDays(t, -2), title: '组会', before: 45, after: 17, method: '自动转录 + 要点摘要' },
      { id: uid(), date: t, title: '文献筛选', before: 60, after: 25, method: 'AI 摘要做初筛' }
    ];
    s.ideal = { restore: 15, create: 35, connect: 25, explore: 25 };
    return s;
  }

  // ---------- derived ----------
  function entriesOn(date) { return S.entries.filter(function (e) { return e.date === date; }).sort(function (a, b) { return toMin(a.start) - toMin(b.start); }); }
  function inRange(days) { var t = todayStr(), from = addDays(t, -(days - 1)); return S.entries.filter(function (e) { return e.date >= from && e.date <= t; }); }
  function blankEnded(e) { var t = todayStr(); return e.date < t || (e.date === t && toMin(e.end) <= nowMin()); }
  function pendingBlanks() { return S.entries.filter(function (e) { return e.kind === 'blank' && e.state === 'reserved' && blankEnded(e); }).sort(function (a, b) { return a.date < b.date ? 1 : -1; }); }
  function upcomingBlanks() { return entriesOn(todayStr()).filter(function (e) { return e.kind === 'blank' && e.state === 'reserved' && !blankEnded(e); }); }
  function mix(list) {
    var m = { necessary: 0, restore: 0, create: 0, connect: 0, explore: 0, blank: 0 };
    list.forEach(function (e) {
      if (e.kind === 'blank') { if (e.state === 'kept' || e.state === 'partial') m[e.use && QUADS.indexOf(e.use) >= 0 ? e.use : 'blank'] += e.kept || 0; }
      else m[e.kind] += dur(e);
    });
    var total = 0; for (var k in m) total += m[k];
    return { m: m, total: total };
  }
  function freedom(list) {
    var x = mix(list), m = x.m, T = x.total;
    if (T < 60) return null;
    var auto = T - m.necessary;
    return { score: Math.round(100 * (0.5 * auto / T + 0.5 * (auto > 0 ? (m.create + m.connect) / auto : 0))), auto: auto / T, meaning: auto > 0 ? (m.create + m.connect) / auto : 0 };
  }
  function keptTotal() { return S.entries.reduce(function (a, e) { return a + (e.kind === 'blank' ? (e.kept || 0) : 0); }, 0); }
  function trialsSaved(date) { return S.trials.filter(function (r) { return !date || r.date === date; }).reduce(function (a, r) { return a + Math.max(0, r.before - r.after); }, 0); }
  function compressFindings(days) {
    var map = {};
    inRange(days).forEach(function (e) {
      if (e.kind !== 'necessary') return;
      var key = e.title.trim();
      if (!map[key]) map[key] = { title: key, minutes: 0, count: 0 };
      map[key].minutes += dur(e); map[key].count++;
    });
    return Object.keys(map).map(function (k) {
      var f = map[k], r = ruleFor(k);
      f.low = Math.round(f.minutes * r.low / days); f.high = Math.round(f.minutes * r.high / days);
      f.perDay = Math.round(f.minutes / days); f.method = r.method;
      return f;
    }).sort(function (a, b) { return b.high - a.high; });
  }
  function overlapsBlank(date, a, b) {
    return entriesOn(date).filter(function (e) { return e.kind === 'blank' && e.state === 'reserved' && toMin(e.start) < b && a < toMin(e.end); });
  }

  // ---------- speech → drafts ----------
  var CN = { '零': 0, '〇': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  function cnNum(s) {
    if (/^\d+(\.\d+)?$/.test(s)) return +s;
    var n = 0, cur = 0;
    for (var i = 0; i < s.length; i++) { var c = s.charAt(i); if (c === '十') { n += (cur || 1) * 10; cur = 0; } else if (c in CN) cur = CN[c]; }
    return n + cur;
  }
  var NUM = '[0-9零〇一二两三四五六七八九十]+';
  var PERIOD = '凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|夜里|今晚';
  var TIME_RE = new RegExp('(' + PERIOD + ')?\\s*(' + NUM + ')\\s*(?:点钟?|:|：|时)\\s*(半|一刻|三刻|(' + NUM + ')\\s*分?)?', 'g');
  function clock(period, h, tail) {
    var m = 0;
    if (tail === '半') m = 30; else if (tail === '一刻') m = 15; else if (tail === '三刻') m = 45; else if (tail) m = cnNum(tail);
    if (/下午|傍晚|晚上|夜里|今晚/.test(period || '') && h < 12) h += 12;
    else if (period === '中午' && h < 11) h += 12;
    else if (!period && h >= 1 && h <= 6) h += 12; // a bare "三点" during waking hours is read as the afternoon
    return Math.min(1440, h * 60 + m);
  }
  function durationOf(s) {
    var m = s.match(/一个半(小时|钟头)/); if (m) return { min: 90, text: m[0] };
    m = s.match(/半(个)?(小时|钟头)/); if (m) return { min: 30, text: m[0] };
    m = s.match(new RegExp('(\\d+\\.\\d+|' + NUM + ')\\s*个?\\s*(小时|钟头)(\\s*(' + NUM + ')\\s*分钟?)?')); if (m) return { min: Math.round(cnNum(m[1]) * 60) + (m[4] ? cnNum(m[4]) : 0), text: m[0] };
    m = s.match(new RegExp('(' + NUM + ')\\s*分钟')); if (m) return { min: cnNum(m[1]), text: m[0] };
    return null;
  }
  var PAST_RE = /刚|已经|花了|用了|做完|搞完/;
  function nextSlot() { return Math.min(1380, Math.ceil((nowMin() + 5) / 15) * 15); }
  function ruleParse(text) {
    var t = todayStr(), out = [], baseDate = t;
    String(text).split(/[，,。；;！!？?\n]+|然后|之后|接着|还有|另外/).forEach(function (seg) {
      seg = (seg || '').trim(); if (!seg) return;
      var date = baseDate;
      var dm = seg.match(/大后天|后天|明天|今天|昨天|前天|今晚/);
      if (dm) { date = addDays(t, { '大后天': 3, '后天': 2, '明天': 1, '今天': 0, '今晚': 0, '昨天': -1, '前天': -2 }[dm[0]]); baseDate = date; }
      var times = [], m, lastPeriod = null, rest = seg;
      TIME_RE.lastIndex = 0;
      while ((m = TIME_RE.exec(seg))) {
        var p = m[1] || lastPeriod; if (m[1]) lastPeriod = m[1];
        times.push(clock(p, cnNum(m[2]), (m[3] || '').replace(/[\s分]/g, ''))); rest = rest.replace(m[0], ' ');
      }
      var d = durationOf(rest); if (d) rest = rest.replace(d.text, ' ');
      var start = null, end = null;
      if (times.length >= 2) { start = times[0]; end = times[1]; if (end <= start && end + 720 > start) end += 720; }
      else if (times.length === 1) { start = times[0]; end = Math.min(1440, start + (d ? d.min : 60)); }
      else if (d && date === t && PAST_RE.test(seg)) { end = nowMin(); start = Math.max(0, end - d.min); }
      else if (d) { start = date === t ? nextSlot() : 540; end = Math.min(1440, start + d.min); }
      var kind = guessKind(seg), prio = prioOf(seg);
      rest = rest.replace(PRIO_STRIP, ' ');
      if (start == null && end == null && kind !== 'blank' && (date !== t || nowMin() < 1380)) { start = date === t ? nextSlot() : 540; end = Math.min(1440, start + 60); }
      var title = rest.replace(new RegExp(PERIOD, 'g'), ' ').replace(/大后天|后天|明天|今天|昨天|前天/g, ' ')
        .replace(/开(\S{1,4}会)/, '$1').replace(/我们|我|刚才|刚刚|花了|用了|大概|大约|左右|一共|从|到|至|要花|要|需要|打算|准备|想|在|去|了|的|-|~|～|—/g, ' ')
        .replace(/\s+/g, ' ').trim();
      if (!times.length && !d && prio !== 3 && !title.replace(/[这那个件事是它就也都很]/g, '').trim() && out.length) { out[out.length - 1].prio = prio; return; }
      if (kind === 'blank') title = '留白';
      if (!title) title = KINDS[kind].label;
      out.push({ id: uid(), title: title.slice(0, 30), kind: kind, prio: prio, date: date, start: start == null ? '' : toHM(start), end: end == null ? '' : toHM(end) });
    });
    return out;
  }
  function normalizeAI(items) {
    var t = todayStr();
    if (!Array.isArray(items)) return [];
    return items.slice(0, 12).map(function (it) {
      if (!it || typeof it.title !== 'string') return null;
      var kind = KINDS[it.kind] ? it.kind : guessKind(it.title);
      var date = /^\d{4}-\d{2}-\d{2}$/.test(it.date || '') ? it.date : t;
      var start = isHM(it.start) ? it.start : '', end = isHM(it.end) ? it.end : '';
      var mins = +it.minutes > 0 ? Math.round(+it.minutes) : 0;
      if (start && !end) end = toHM(Math.min(1440, toMin(start) + (mins || 60)));
      if (!start && end && mins) start = toHM(toMin(end) - mins);
      if (!start && !end && mins) { var a0 = date === t ? nextSlot() : 540; start = toHM(a0); end = toHM(a0 + mins); }
      if (!start && !end && kind !== 'blank') { var a1 = date === t ? nextSlot() : 540; start = toHM(a1); end = toHM(Math.min(1440, a1 + 60)); }
      return { id: uid(), title: (kind === 'blank' ? '留白' : it.title.replace(PRIO_STRIP, '').trim() || it.title).slice(0, 30), kind: kind, prio: [1, 2, 3, 4, 5].indexOf(+it.prio) >= 0 ? +it.prio : prioOf(it.title), date: date, start: start, end: end };

        items.push(d.kind === 'blank' ? blankEntry(d.date, d.start, d.end) : { id: uid(), date: d.date, start: d.start, end: d.end, title: d.title || KINDS[d.kind].label, kind: d.kind, prio: P(d) });
      });
      S.drafts = keep; save();
      if (!items.length) { render(); toast('先补完标黄的'); return; }
      place(items, function (n) { toast(n ? '记下 ' + n + ' 条' : '没有记下'); });
      return;
    }
    if (act === 'clash') { var cb = clashCb; clashCb = null; closeSheet(); if (cb) cb(el.getAttribute('data-v')); return; }
    if (act === 'reserve') return reserveSheet();
    if (act === 'res-min') { resMin = +el.getAttribute('data-v'); el.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === el)); }); return; }
    if (act === 'res-save') {
      var st = document.getElementById('r-start').value; if (!st) return;
      var a = toMin(st), b = Math.min(1440, a + resMin); if (b - a < 10) { toast('不能跨过午夜'); return; }
      S.entries.push({ id: uid(), date: todayStr(), start: st, end: toHM(b), title: '留白', kind: 'blank', state: 'reserved', kept: 0, use: null, note: '', intent: '' });
      save(); closeSheet(); render(); toast('留出来了'); return;
    }
    if (act === 'kept' || act === 'taken') { var e1 = byId(el.getAttribute('data-id')); if (e1) { e1.state = act; e1.kept = act === 'kept' ? dur(e1) : 0; save(); closeSheet(); render(); } return; }
    if (act === 'del') { var did = el.getAttribute('data-id'); S.entries = S.entries.filter(function (e) { return e.id !== did; }); if (bubSel === did) bubSel = null; save(); closeSheet(); render(); toast('已删除'); return; }
    if (act === 'leaf') { var e4 = byId(el.getAttribute('data-id')); if (e4) leafSheet(e4); return; }
    if (act === 'day') { var n = +el.getAttribute('data-d'); lineDate = addDays(lineDate || todayStr(), n); if (lineDate === todayStr()) lineDate = null; render(); return; }
    if (act === 'pick') { var pm = +el.getAttribute('data-m'); if (pick[pm]) delete pick[pm]; else pick[pm] = 1; render(); return; }
    if (act === 'pick-save') {
      var ms = Object.keys(pick).map(Number).sort(function (a, b) { return a - b; }); if (!ms.length) return;
      var runs = [], cur = null;
      ms.forEach(function (m) { if (cur && cur[1] === m) cur[1] = m + 30; else { cur = [m, m + 30]; runs.push(cur); } });
      pick = {};
      place(runs.map(function (x) { return blankEntry(todayStr(), toHM(x[0]), toHM(x[1])); }), function (n) { toast(n ? '留出来了' : '这次没留'); });
      return;
    }
    if (act === 'draft-prio') { var dp = draftById(el); if (dp) { dp.prio = P(dp) % 5 + 1; save(); render(); } return; }
    if (act === 'bubble') {
      var bx = document.getElementById('bubbles'), bb = bx && bx._items && bx._items.filter(function (x) { return x.el === el; })[0];
      if (bb && bb.justDragged) { bb.justDragged = false; return; }
      var id0 = el.getAttribute('data-id'); bubSel = bubSel === id0 ? null : id0; render(); return;
    }
    if (act === 'unsel') { bubSel = null; render(); return; }
    if (act === 'prio-up' || act === 'prio-down') {
      var es = bubSel && byId(bubSel); if (!es) return;
      var np = Math.max(1, Math.min(5, P(es) + (act === 'prio-up' ? -1 : 1))); es.prio = np; save();
      if (bub[es.id]) bub[es.id].vy += act === 'prio-up' ? -9 : 6;
      render(); var pe = document.querySelector('.bubble.sel'); if (pe) pe.classList.add('pop');
      return;
    }
    if (act === 'edit') return editSheet();
    if (act === 'ed-prio') { editPrio = +el.getAttribute('data-v'); el.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === el)); }); return; }
    if (act === 'ed-save') {
      var ee = bubSel && byId(bubSel); if (!ee) return closeSheet();
      var t1 = document.getElementById('ed-title').value.trim(), a1 = hm(document.getElementById('ed-start').value), b1 = hm(document.getElementById('ed-end').value);
      if (!isHM(a1) || !isHM(b1) || toMin(b1) <= toMin(a1)) { toast('时间不对'); return; }
      if (t1 && ee.kind !== 'blank') ee.title = t1; ee.start = a1; ee.end = b1; if (ee.kind !== 'blank') ee.prio = editPrio;
      save(); closeSheet(); render(); toast('改好了'); return;
    }
    if (act === 'sort') { S.sortBy = el.getAttribute('data-d'); save(); render(); return; }
    if (act === 'to-ai') {
      var e3 = byId(el.getAttribute('data-id')), a3 = e3 && aiPlan(e3); if (!a3) return;
      var newEnd = toMin(e3.start) + a3.after, oldEnd = toMin(e3.end);
      e3.ai = { before: a3.before, after: a3.after, method: a3.method }; e3.end = toHM(newEnd);
      S.entries.push({ id: uid(), date: e3.date, start: toHM(newEnd), end: toHM(oldEnd), title: '留白', kind: 'blank', state: 'reserved', kept: 0, use: null, note: '', intent: '', from: e3.id });
      save(); closeSheet(); render(); toast('省下 ' + fmtPlain(a3.saved) + '，已留白'); return;
    }
    if (act === 'range') { range = +el.getAttribute('data-d'); render(); return; }
    if (act === 'ob-real' || act === 'ob-demo') {
      var nm = (document.getElementById('o-name').value || '').trim();
      if (act === 'ob-demo') S = demoState(); else S.mode = 'real';
      if (nm) S.name = nm; save(); closeSheet(); render(); return;
    }
    if (act === 'start-real') { S.entries = []; S.trials = []; S.drafts = []; S.ideal = null; S.mode = 'real'; S.name = ''; save(); render(); toast('已清空'); return; }
    if (act === 'ai-test') {
      readAI();
      var tg = L.mode === 'custom' ? customTarget() : L.mode === 'off' ? null : serverTarget();
      if (!tg) { toast(L.mode === 'auto' ? '自动：在 Claude 里用 Claude，否则用规则' : '没有可用的接口'); return; }
      toast('测试中…');
      llmJSON(tg, '只输出 JSON：{"ok":true}', 30000).then(function () { toast('连上了 · ' + tg.model); }, function (e) { toast('连不上：' + (e && e.message || '出错')); });
      return;
    }
    if (act === 'export') { document.getElementById('dataBox').innerHTML = '<div class="field"><label for="exp">数据</label><textarea id="exp" readonly>' + esc(JSON.stringify(S)) + '</textarea></div><button class="btn sm" data-act="copy" style="margin-top:8px">复制</button>'; return; }
    if (act === 'copy') {
      var ex = document.getElementById('exp'), sel = function () { ex.select(); toast('已选中'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ex.value).then(function () { toast('已复制'); }, sel); else sel();
      return;
    }
    if (act === 'import-open') { document.getElementById('dataBox').innerHTML = '<div class="field"><label for="imp">粘贴数据</label><textarea id="imp"></textarea></div><button class="btn sm" data-act="import" style="margin-top:8px">导入</button>'; return; }
    if (act === 'import') {
      try { var s2 = JSON.parse(document.getElementById('imp').value); if (!s2 || s2.v !== 1 || !Array.isArray(s2.entries)) throw 0; s2.drafts = s2.drafts || []; s2.trials = s2.trials || []; S = s2; save(); render(); toast('已导入'); }
      catch (e2) { toast('无法识别'); }
      return;
    }
    if (act === 'load-demo') { openSheet('<h2>载入示例？</h2><p class="muted small">会替换当前数据</p><button class="btn primary wide" data-act="demo-yes">载入</button><button class="btn wide" data-act="close">取消</button>'); return; }
    if (act === 'demo-yes') { S = demoState(); save(); closeSheet(); render(); return; }
    if (act === 'wipe') { openSheet('<h2>清空全部？</h2><p class="muted small">不能撤销</p><button class="btn primary wide" data-act="wipe-yes">清空</button><button class="btn wide" data-act="close">取消</button>'); return; }
    if (act === 'wipe-yes') { S = blankState(); S.mode = 'real'; save(); closeSheet(); location.hash = '#today'; render(); return; }
    if (act === 'close') return closeSheet();
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.id === 's-ai') { var md = ev.target.value; document.querySelectorAll('[data-ai]').forEach(function (el) { el.hidden = el.getAttribute('data-ai') !== md; }); return; }
    var f = ev.target.getAttribute && ev.target.getAttribute('data-f'); if (!f) return;
    var d = draftById(ev.target); if (!d) return;
    var v = ev.target.value.trim();
    if (f !== 'title') { v = v.replace('：', ':'); var mm = v.match(/^(\d{1,2})(?::?(\d{2}))?$/); if (mm && +mm[1] <= 24) v = pad(+mm[1]) + ':' + (mm[2] || '00'); d.force = false; }
    d[f] = v;
    save(); render();
  });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'capForm') return parseInput(document.getElementById('cap-text').value);
    if (ev.target.id === 'setForm') {
      S.name = document.getElementById('s-name').value.trim();
      S.sound = document.getElementById('s-sound').checked;
      readAI(); saveLLM();
      var wk = +document.getElementById('s-wake').value; if (wk >= 8 && wk <= 20) S.wake = Math.round(wk * 60);
      save(); render(); toast('已保存');
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && document.querySelector('.overlay')) { var cb = clashCb; clashCb = null; closeSheet(); if (cb) cb('cancel'); }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('leaf')) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  window.addEventListener('resize', function () { clearTimeout(window.__bt); window.__bt = setTimeout(bubSetup, 150); });
  window.addEventListener('hashchange', function () { capState.msg = ''; render(); window.scrollTo(0, 0); });

  window.__leubaiParse = ruleParse;
  render();
  if (!S.mode) onboard();
})();
</script>
