<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- LEUBAI:BODY-START -->
<title>留白 LeuBai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: a narrow porcelain rail + one reading column; the day is drawn as a 24h dial, unscheduled time stays visibly empty. */
:root {
  --bg: #F3F5F6;
  --surface: #FFFFFF;
  --surface-2: #F8FAFA;
  --text: #232C32;
  --text-2: #5F6C75;
  --line: #DDE4E7;
  --accent: #426D92;
  --ok: #4D7771;
  --warm: #956C43;
  --k-nec: #8A959C;
  --k-restore: #5E8C7E;
  --k-create: #B58448;
  --k-connect: #B0645A;
  --k-explore: #4F7BA3;
  --k-blank: #FFFFFF;
  --k-blank-line: #9AA8B0;
  --shadow: 0 14px 40px rgba(35, 44, 50, .06);
  --font-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171A; --surface: #1A2126; --surface-2: #1F272D; --text: #E7ECEE; --text-2: #A3B0B8; --line: #2E393F;
    --accent: #8DB3D4; --ok: #8FBDB4; --warm: #D2A876; --k-nec: #6D7A82; --k-restore: #7FB2A2; --k-create: #D3A467;
    --k-connect: #D18A7F; --k-explore: #7FA7CC; --k-blank: #12171A; --k-blank-line: #7D8C94; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171A; --surface: #1A2126; --surface-2: #1F272D; --text: #E7ECEE; --text-2: #A3B0B8; --line: #2E393F;
  --accent: #8DB3D4; --ok: #8FBDB4; --warm: #D2A876; --k-nec: #6D7A82; --k-restore: #7FB2A2; --k-create: #D3A467;
  --k-connect: #D18A7F; --k-explore: #7FA7CC; --k-blank: #12171A; --k-blank-line: #7D8C94; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 400; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.25; }
h2 { font-size: 21px; line-height: 1.35; }
h3 { font-size: 17px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; font-family: var(--font-serif); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app { display: grid; grid-template-columns: 96px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 8px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { font-family: var(--font-serif); font-size: 22px; line-height: 1.2; text-align: center; margin-bottom: 22px; color: var(--text); text-decoration: none; }
.nav { display: flex; flex-direction: column; gap: 2px; width: 100%; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px; border-radius: var(--r-sm); color: var(--text-2); text-decoration: none; font-size: 12.5px; }
.nav a .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
.nav a[aria-current="page"] { color: var(--text); background: var(--surface-2); }
.nav a[aria-current="page"] .dot { background: currentColor; }
.nav a:hover { color: var(--text); }
.rail .spacer { flex: 1; }
.main { min-width: 0; padding-block: 36px 96px; padding-inline: clamp(16px, 5vw, 64px); }
.page { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
.mobile-top { display: none; }
.tabbar { display: none; }

.eyebrow { font-size: 12.5px; letter-spacing: .14em; color: var(--text-2); }
.lede { color: var(--text-2); max-width: 62ch; }
.head { display: grid; gap: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow); min-width: 0; }
.panel.quiet { background: transparent; box-shadow: none; }
.panel > h2 + * { margin-top: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.hr { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; color: var(--text); }
.btn:hover { border-color: var(--text-2); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--k-connect); border-color: var(--k-connect); }
.btn.sm { min-height: 34px; padding: 0 13px; font-size: 13.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip.blank i { background: var(--k-blank); border: 1.5px dashed var(--k-blank-line); }

.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 13px; color: var(--text-2); }
.field input, .field select, .field textarea { min-height: 42px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); width: 100%; }
.field textarea { min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; align-items: end; }

/* Hero: the 24h dial */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: center; }
.big { font-size: clamp(48px, 9vw, 84px); line-height: 1; letter-spacing: -.01em; }
.big small { font-size: .38em; color: var(--text-2); margin: 0 .18em 0 .06em; }
.dial { width: 100%; max-width: 300px; aspect-ratio: 1; justify-self: center; }
.dial text { fill: var(--text-2); font-size: 10px; font-family: var(--font-sans); }
.dial .now { stroke: var(--text); }

.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 13.5px; }
.bar-track { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; }
.stackbar { display: flex; height: 18px; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.stackbar span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-2); }
.legend b { font-weight: 400; color: var(--text); }

.timeline { display: grid; gap: 0; }
.t-item { display: grid; grid-template-columns: 112px 6px minmax(0, 1fr) auto; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: center; }
.t-item:last-child { border-bottom: 0; }
.t-time { font-size: 14px; color: var(--text-2); }
.t-mark { align-self: stretch; border-radius: 3px; }
.t-mark.blank { background: transparent; border: 1.5px dashed var(--k-blank-line); }
.t-title { min-width: 0; overflow-wrap: anywhere; }
.t-gap { padding: 10px 0 10px 126px; color: var(--text-2); font-size: 12.5px; border-bottom: 1px solid var(--line); }

.stat { display: grid; gap: 4px; }
.stat .v { font-size: 34px; line-height: 1.1; }
.stat .k { font-size: 13px; color: var(--text-2); }

.card { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; background: var(--surface); display: grid; gap: 8px; min-width: 0; }
.card.default { border-color: var(--text); }
.notice { border-radius: var(--r-md); padding: 12px 16px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; color: var(--text-2); }
.demo-banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 16px; border-radius: var(--r-md); border: 1px dashed var(--warm); color: var(--warm); font-size: 13.5px; }
.quote { font-family: var(--font-serif); font-size: 19px; line-height: 1.7; }
.pending { border-left: 3px solid var(--warm); padding-left: 14px; display: grid; gap: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.empty { padding: 26px; text-align: center; color: var(--text-2); border: 1px dashed var(--line); border-radius: var(--r-md); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-weight: 400; color: var(--text-2); font-size: 12.5px; }
.scroll-x { overflow-x: auto; }

.overlay { position: fixed; inset: 0; background: rgba(18, 23, 26, .42); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: var(--r-lg); padding: 26px; display: grid; gap: 16px; border: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }

.charter ol { padding-left: 1.3em; display: grid; gap: 14px; margin: 0; }
.charter li p { color: var(--text-2); }
.chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.chain span { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chain em { font-style: normal; color: var(--text-2); }

@media (max-width: 880px) {
  .hero { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
  .grid3 { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .main { padding-block: 12px 110px; }
  .mobile-top { display: flex; justify-content: space-between; align-items: center; padding-block: 8px; max-width: 980px; margin: 0 auto 6px; }
  .mobile-top .brand { margin: 0; font-size: 20px; letter-spacing: .1em; }
  .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); z-index: 40; }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--text-2); text-decoration: none; font-size: 12px; }
  .tabbar a .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
  .tabbar a[aria-current="page"] { color: var(--text); }
  .tabbar a[aria-current="page"] .dot { background: currentColor; }
  .panel { padding: 18px; }
  .t-item { grid-template-columns: 88px 5px minmax(0, 1fr); }
  .t-item .t-actions { grid-column: 3; }
  .t-gap { padding-left: 107px; }
  .stat .v { font-size: 28px; }
}
@media (prefers-reduced-motion: no-preference) {
  .page { animation: rise .32s ease-out both; }
  @keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>

<div class="app">
  <aside class="rail" aria-label="主导航">
    <a class="brand" href="#today" aria-label="留白">留<br>白</a>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <nav class="nav" id="nav2"></nav>
  </aside>
  <main class="main">
    <div class="mobile-top">
      <a class="brand" href="#today">留白</a>
      <div class="row"><a class="btn sm ghost" href="#charter">宪章</a><a class="btn sm ghost" href="#settings">设置</a></div>
    </div>
    <div id="view"></div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
</div>
<div id="layer"></div>

<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var KINDS = {
    necessary: { label: '必要', long: '必要时间', color: 'var(--k-nec)' },
    restore: { label: '恢复', long: '恢复时间', color: 'var(--k-restore)' },
    create: { label: '创造', long: '创造时间', color: 'var(--k-create)' },
    connect: { label: '连接', long: '连接时间', color: 'var(--k-connect)' },
    explore: { label: '探索', long: '探索时间', color: 'var(--k-explore)' },
    blank: { label: '留白', long: '留白', color: 'var(--k-blank-line)' }
  };
  var QUADS = ['restore', 'create', 'connect', 'explore'];
  var USES = { blank: '空着本身', restore: '恢复', create: '创造', connect: '连接', explore: '探索', private: '不想说' };
  var PAGES = [
    { id: 'today', label: '今日', title: '首页' },
    { id: 'flow', label: '时间流', title: '时间流' },
    { id: 'compress', label: '压缩', title: 'AI 压缩' },
    { id: 'account', label: '账户', title: '留白账户' },
    { id: 'invest', label: '投资', title: '人生投资' },
    { id: 'suggest', label: '建议', title: '留白建议' }
  ];
  var PAGES2 = [{ id: 'charter', label: '宪章' }, { id: 'settings', label: '设置' }];
  var STORE_KEY = 'leubai.web.v1';

  var RULES = [
    { re: /邮件|email|回复|消息/i, low: 0.3, high: 0.55, method: 'AI 起草常规回复，你只审阅和修改' },
    { re: /会议|纪要|组会|周会|例会|开会/, low: 0.3, high: 0.6, method: '自动转录与要点摘要，会后只核对' },
    { re: /论文|文献|筛选|初筛|材料/, low: 0.3, high: 0.6, method: 'AI 摘要做初筛，精读留给自己' },
    { re: /报销|行政|表格|填报|审批|整理/, low: 0.2, high: 0.45, method: '模板与自动填表，你只核对提交' },
    { re: /通勤|路上|排队/, low: 0, high: 0, method: '这段很难交给 AI；可以只把它当作路上的时间' }
  ];
  var DEFAULT_RULE = { low: 0.1, high: 0.3, method: '先记录一周，再判断哪一段适合交给 AI' };

  var IDEAS = {
    restore: [['散步', 40], ['什么都不看，坐一会儿', 20], ['午睡', 25], ['慢慢做一顿饭', 60], ['拉伸', 15]],
    create: [['继续写那段一直想写的文字', 60], ['画一页速写', 30], ['把一个想法写成一页纸，不为交付', 40], ['弹一首曲子', 30]],
    connect: [['给父母打个电话', 20], ['约一位朋友吃饭', 90], ['陪家人散步', 45], ['给很久没联系的人写几句话', 15]],
    explore: [['学一节新课程的第一课', 45], ['读与工作无关的书 30 页', 40], ['去一个没去过的街区走走', 60], ['看一部纪录片', 90]]
  };
  var LINES = [
    '不要急于安排新的任务。今天被归还的时间，属于你自己。',
    'AI 负责完成必须做的事，人负责成为想成为的人。',
    '空着的时间不需要理由。',
    '省下的时间，默认不再被塞满。',
    '今天最重要的事是什么？只回答一件就够。',
    '你可以不优化这一天。',
    '请求不是责任，推迟也不是节省。'
  ];

  // ---------- utils ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function addDays(s, n) { var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + n); return ymd(d); }
  function toMin(t) { var p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); }
  function toHM(m) { m = Math.max(0, Math.round(m)); return pad(Math.floor(m / 60) % 24 === 0 && m >= 1440 ? 24 : Math.floor(m / 60)) + ':' + pad(m % 60); }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function dur(e) { var a = toMin(e.start), b = toMin(e.end); return b > a ? b - a : 0; }
  function fmt(m) {
    m = Math.max(0, Math.round(m));
    var h = Math.floor(m / 60), r = m % 60;
    if (!h) return '<span class="num">' + r + '</span><small>分钟</small>';
    return '<span class="num">' + h + '</span><small>小时</small>' + (r ? '<span class="num">' + r + '</span><small>分</small>' : '');
  }
  function fmtPlain(m) { m = Math.max(0, Math.round(m)); var h = Math.floor(m / 60), r = m % 60; return h ? h + ' 小时' + (r ? ' ' + r + ' 分' : '') : r + ' 分钟'; }
  function pct(x) { return Math.round(x * 100); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function dateLabel(s) {
    var t = todayStr();
    if (s === t) return '今天';
    if (s === addDays(t, -1)) return '昨天';
    if (s === addDays(t, 1)) return '明天';
    var p = s.split('-'); return (+p[1]) + '月' + (+p[2]) + '日';
  }
  function hashInt(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  function ruleFor(title) { for (var i = 0; i < RULES.length; i++) if (RULES[i].re.test(title)) return RULES[i]; return DEFAULT_RULE; }

  // ---------- state ----------
  var memoryOnly = false;
  function blankState() {
    return { v: 1, mode: null, name: '', wake: 960, ideal: null, entries: [], trials: [] };
  }
  function load() {
    try { var raw = localStorage.getItem(STORE_KEY); if (raw) { var s = JSON.parse(raw); if (s && s.v === 1) return s; } } catch (e) { memoryOnly = true; }
    return blankState();
  }
  var S = load();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { memoryOnly = true; } }

  // ---------- demo ----------
  function demoState() {
    var s = blankState();
    s.mode = 'demo'; s.name = 'Yajing';
    var t = todayStr();
    var E = [];
    function add(day, a, b, title, kind, extra) {
      var e = { id: uid(), date: addDays(t, day), start: a, end: b, title: title, kind: kind };
      if (extra) for (var k in extra) e[k] = extra[k];
      E.push(e);
    }
    for (var d = -20; d <= 0; d++) {
      var date = addDays(t, d), p = date.split('-'), wd = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
      var weekend = wd === 0 || wd === 6, v = hashInt(date) % 4;
      if (!weekend) {
        add(d, '09:00', '10:00', '组会', 'necessary');
        add(d, '10:00', '11:30', '论文阅读', 'explore');
        add(d, '11:30', '12:10', '邮件回复', 'necessary');
        add(d, '13:00', v === 0 ? '14:00' : '15:00', '课程设计', 'create');
        if (v !== 0) add(d, '15:10', '16:10', '文献筛选', 'necessary');
        add(d, '16:20', '17:00', '邮件回复', 'necessary');
        if (v === 2) add(d, '17:00', '17:40', '报销与行政', 'necessary');
        add(d, '18:00', '19:20', '晚餐与聊天', 'connect');

  // ---------- derived ----------
  function entriesOn(date) { return S.entries.filter(function (e) { return e.date === date; }).sort(function (a, b) { return toMin(a.start) - toMin(b.start); }); }
  function inRange(days) { var t = todayStr(), from = addDays(t, -(days - 1)); return S.entries.filter(function (e) { return e.date >= from && e.date <= t; }); }
  function blankEnded(e) { var t = todayStr(); return e.date < t || (e.date === t && toMin(e.end) <= nowMin()); }
  function pendingBlanks() { return S.entries.filter(function (e) { return e.kind === 'blank' && e.state === 'reserved' && blankEnded(e); }).sort(function (a, b) { return a.date < b.date ? 1 : -1; }); }
  function upcomingBlanks() { var t = todayStr(); return entriesOn(t).filter(function (e) { return e.kind === 'blank' && e.state === 'reserved' && !blankEnded(e); }); }

  // minutes per kind; a kept blank counts by its declared use (unused = blank)
  function mix(list) {
    var m = { necessary: 0, restore: 0, create: 0, connect: 0, explore: 0, blank: 0 };
    list.forEach(function (e) {
      if (e.kind === 'blank') {
        if (e.state === 'kept' || e.state === 'partial') {
          var k = e.kind === 'blank' && e.use && QUADS.indexOf(e.use) >= 0 ? e.use : 'blank';
          m[k] += e.kept || 0;
        } else if (e.state === 'reserved' && !blankEnded(e)) { /* future: not yet lived */ }
      } else m[e.kind] += dur(e);
    });
    var total = 0; for (var k in m) total += m[k];
    return { m: m, total: total };
  }
  function freedom(list) {
    var x = mix(list), m = x.m, T = x.total;
    if (T < 60) return null;
    var auto = T - m.necessary;
    var autoShare = auto / T;
    var meaning = auto > 0 ? (m.create + m.connect) / auto : 0;
    return { score: Math.round(100 * (0.5 * autoShare + 0.5 * meaning)), auto: autoShare, meaning: meaning, create: m.create / T, connect: m.connect / T, total: T };
  }
  function keptTotal() { return S.entries.reduce(function (a, e) { return a + (e.kind === 'blank' ? (e.kept || 0) : 0); }, 0); }
  function trialsSaved(date) { return S.trials.filter(function (r) { return !date || r.date === date; }).reduce(function (a, r) { return a + Math.max(0, r.before - r.after); }, 0); }

    var map = {};

      map[key].minutes += dur(e); map[key].count++;

    return Object.keys(map).map(function (k) {

      f.perDay = Math.round(f.minutes / days); f.method = r.method;

  }

  // ---------- actions ----------
  function overlapsBlank(date, a, b, ignoreId) {
    return entriesOn(date).filter(function (e) { return e.kind === 'blank' && e.state === 'reserved' && e.id !== ignoreId && toMin(e.start) < b && a < toMin(e.end); });
  }
  var pendingAdd = null;

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'layer-bg') { if (ev.target === el) closeLayer(); return; }
    if (act === 'close') return closeLayer();
    if (act === 'reserve') return reserveDialog(+el.getAttribute('data-min') || 60);
    if (act === 'res-save') {
      var d = document.getElementById('r-date').value, st = document.getElementById('r-start').value, mm = +document.getElementById('r-min').value;
      var w = document.getElementById('resWarn');
      if (!d || !st || !(mm >= 10)) { w.hidden = false; w.textContent = '请填好日期、开始时间和时长（至少 10 分钟）。'; return; }
      var a = toMin(st), b = Math.min(1440, a + mm);
      if (b - a < 10) { w.hidden = false; w.textContent = '这段留白会跨过午夜，请换一个更早的开始时间。'; return; }
      S.entries.push({ id: uid(), date: d, start: st, end: toHM(b), title: '留白', kind: 'blank', state: 'reserved', kept: 0, use: null, note: '', intent: '' });
      save(); closeLayer(); render(); toast('已留出 ' + fmtPlain(b - a) + '。这段时间默认不再被塞满。'); return;
    }
    if (act === 'start-real') { S.entries = []; S.trials = []; S.ideal = null; S.mode = 'real'; S.name = ''; save(); render(); toast('示例已清空。'); return; }
    if (act === 'ob-real' || act === 'ob-demo') {
      var nm = (document.getElementById('o-name').value || '').trim();
      if (act === 'ob-demo') S = demoState(); else S.mode = 'real';
      if (nm) S.name = nm;
      save(); closeLayer(); render(); return;
    }
    if (act === 'day') { var dd = +el.getAttribute('data-d'); flowDate = dd === 0 ? null : addDays(flowDate || todayStr(), dd); render(); return; }
    if (act === 'del') { S.entries = S.entries.filter(function (e) { return e.id !== el.getAttribute('data-id'); }); save(); render(); return; }
    if (act === 'add-anyway') { if (pendingAdd) { S.entries.push(pendingAdd); pendingAdd = null; save(); render(); toast('已记下。这段留白之后可以确认为“被占用”。'); } return; }
    if (act === 'c-state') {
      var box = el.closest('.pending'), v = el.getAttribute('data-v');
      box.querySelectorAll('[data-act="c-state"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === el)); });
      box.setAttribute('data-state', v);
      var more = box.querySelector('.c-more'); more.hidden = false;
      box.querySelector('.c-partial').hidden = v !== 'partial';
      box.querySelector('select').closest('.field').hidden = v === 'taken' || v === 'unknown';
      return;
    }
    if (act === 'c-save') {
      var pb = el.closest('.pending'), id = pb.getAttribute('data-id'), state = pb.getAttribute('data-state');
      var e = S.entries.filter(function (x) { return x.id === id; })[0]; if (!e || !state) return;
      e.state = state;
      e.kept = state === 'kept' ? dur(e) : state === 'partial' ? Math.max(1, Math.min(dur(e), +document.getElementById('kp-' + id).value || 0)) : 0;
      e.use = (state === 'kept' || state === 'partial') ? (document.getElementById('ku-' + id).value || null) : null;
      e.note = (document.getElementById('kn-' + id).value || '').trim();
      save(); render(); toast(e.kept ? '记进了留白账户：' + fmtPlain(e.kept) : '照实记下了。'); return;
    }
    if (act === 'trial') return trialDialog(el.getAttribute('data-title'), +el.getAttribute('data-before'));
    if (act === 'trial-save') {
      var tb = +document.getElementById('t-before').value, ta = +document.getElementById('t-after').value, tt = document.getElementById('t-title').value.trim();
      if (!tt || !(tb > 0) || !(ta >= 0)) return;
      S.trials.push({ id: uid(), date: todayStr(), title: tt, before: tb, after: ta, method: document.getElementById('t-method').value.trim() });
      save(); closeLayer(); render(); toast(ta < tb ? '确认节省 ' + (tb - ta) + ' 分钟。' : '这次没有省下时间，也照实记下了。'); return;
    }
    if (act === 'del-trial') { S.trials = S.trials.filter(function (r) { return r.id !== el.getAttribute('data-id'); }); save(); render(); return; }
    if (act === 'range') { investRange = +el.getAttribute('data-d'); render(); return; }
    if (act === 'ideal-edit') return idealDialog();
    if (act === 'ideal-save') {
      var vals = {}, sum = 0; QUADS.forEach(function (k) { vals[k] = Math.max(0, Math.round(+document.getElementById('i-' + k).value || 0)); sum += vals[k]; });
      if (sum !== 100) { updateIdealSum(); return; }
      S.ideal = vals; save(); closeLayer(); render(); return;
    }
    if (act === 'ideal-clear') { S.ideal = null; save(); closeLayer(); render(); return; }
    if (act === 'spin') { var k = el.getAttribute('data-k'); suggestSpin[k] = (suggestSpin[k] || 0) + 1; render(); return; }
    if (act === 'intent') { var up = upcomingBlanks()[0]; if (up) { up.intent = el.getAttribute('data-v'); save(); render(); toast(up.intent ? '记下了这个念头。不会提醒你。' : '好，什么都不安排。'); } return; }
    if (act === 'export') {
      document.getElementById('dataBox').innerHTML = '<div class="field" style="margin-top:12px"><label for="exp">你的全部数据（JSON）</label><textarea id="exp" readonly>' + esc(JSON.stringify(S, null, 1)) + '</textarea></div><button class="btn sm" data-act="copy" style="margin-top:8px">复制</button>';
      return;
    }
    if (act === 'copy') {
      var ta2 = document.getElementById('exp');
      var done = function () { toast('已复制。'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta2.value).then(done, function () { ta2.select(); toast('已选中，请手动复制。'); });
      else { ta2.select(); toast('已选中，请手动复制。'); }
      return;
    }
    if (act === 'import-open') {
      document.getElementById('dataBox').innerHTML = '<div class="field" style="margin-top:12px"><label for="imp">粘贴之前导出的 JSON</label><textarea id="imp"></textarea></div><button class="btn sm" data-act="import" style="margin-top:8px">导入并替换当前数据</button>';
      return;
    }
    if (act === 'import') {
      try { var s2 = JSON.parse(document.getElementById('imp').value); if (!s2 || s2.v !== 1 || !Array.isArray(s2.entries)) throw 0; S = s2; save(); render(); toast('已导入。'); }
      catch (e2) { toast('这段文本不是留白导出的数据。'); }
      return;
    }
    if (act === 'load-demo') { openLayer('<h2>载入示例？</h2><p class="muted">当前数据会被示例替换。需要的话先导出。</p><div class="row"><button class="btn primary" data-act="demo-yes">载入示例</button><button class="btn ghost" data-act="close">取消</button></div>'); return; }
    if (act === 'demo-yes') { var keep = S.name; S = demoState(); if (keep && keep !== 'Yajing') S.name = keep; save(); closeLayer(); render(); return; }
    if (act === 'wipe') { openLayer('<h2>清空全部数据？</h2><p class="muted">所有时间记录、尝试记录和设置都会删除，不能撤销。</p><div class="row"><button class="btn danger" data-act="wipe-yes">清空</button><button class="btn ghost" data-act="close">取消</button></div>'); return; }
    if (act === 'wipe-yes') { S = blankState(); S.mode = 'real'; save(); closeLayer(); location.hash = '#today'; render(); return; }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target;
    if (f.id === 'addForm') {
      var date = flowDate || todayStr(), title = document.getElementById('f-title').value.trim(), kind = document.getElementById('f-kind').value;
      var st = document.getElementById('f-start').value, en = document.getElementById('f-end').value, w = document.getElementById('addWarn');
      if (!title || !st || !en) return;
      if (toMin(en) <= toMin(st)) { w.hidden = false; w.textContent = '结束时间要晚于开始时间。跨过午夜的时间，请分成两段记。'; return; }
      var entry = { id: uid(), date: date, start: st, end: en, title: title, kind: kind };
      var hit = overlapsBlank(date, toMin(st), toMin(en));
      if (hit.length) {
        pendingAdd = entry;
        w.hidden = false;
        w.innerHTML = '这段时间和你预留的留白（' + hit.map(function (e) { return e.start + '–' + e.end; }).join('、') + '）重叠。留白默认不被再次塞满。 <button class="btn sm" type="button" data-act="add-anyway">仍然记下</button>';
        return;
      }
      S.entries.push(entry); save(); render();
      var nextStart = en, nx = Math.min(1439, toMin(en) + 60);
      document.getElementById('f-start').value = nextStart; document.getElementById('f-end').value = toHM(nx);
      toast('记下了：' + title);
      return;
    }
    if (f.id === 'setForm') {
      S.name = document.getElementById('s-name').value.trim();
      var wk = +document.getElementById('s-wake').value; if (wk >= 8 && wk <= 20) S.wake = Math.round(wk * 60);
      save(); render(); toast('已保存。'); return;
    }
  });
  document.addEventListener('input', function (ev) { if (ev.target.id && ev.target.id.indexOf('i-') === 0) updateIdealSum(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && document.querySelector('.overlay')) closeLayer(); });
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });

  render();
  if (!S.mode) onboard();
})();
</script>
<!-- LEUBAI:BODY-END -->
</body>
</html>
