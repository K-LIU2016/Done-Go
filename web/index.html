<style>
/* Layout: phone-first single column with voice capture first; widens to two-up cards on tablet and a side rail with a capture column on desktop. */
:root {
  --outer: #E9EDEF;
  --bg: #F3F5F6;
  --surface: #FFFFFF;
  --surface-2: #F6F8F9;
  --text: #232C32;
  --text-2: #5F6C75;
  --line: #DDE4E7;
  --accent: #426D92;
  --warm: #956C43;
  --k-nec: #8A959C;
  --k-restore: #5E8C7E;
  --k-create: #B58448;
  --k-connect: #B0645A;
  --k-explore: #4F7BA3;
  --k-blank-line: #9AA8B0;
  --font-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --outer: #0D1113; --bg: #12171A; --surface: #1A2126; --surface-2: #20292F; --text: #E7ECEE; --text-2: #A3B0B8; --line: #2E393F;
    --accent: #8DB3D4; --warm: #D2A876; --k-nec: #73818A; --k-restore: #7FB2A2; --k-create: #D3A467; --k-connect: #D18A7F; --k-explore: #7FA7CC; --k-blank-line: #7D8C94; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --outer: #0D1113; --bg: #12171A; --surface: #1A2126; --surface-2: #20292F; --text: #E7ECEE; --text-2: #A3B0B8; --line: #2E393F;
  --accent: #8DB3D4; --warm: #D2A876; --k-nec: #73818A; --k-restore: #7FB2A2; --k-create: #D3A467; --k-connect: #D18A7F; --k-explore: #7FA7CC; --k-blank-line: #7D8C94; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--outer); color: var(--text); font-family: var(--font-sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 26px; line-height: 1.3; }
h2 { font-size: 18px; line-height: 1.4; }
h3 { font-size: 16px; line-height: 1.4; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; font-family: var(--font-serif); }

.app { max-width: 460px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-inline: 16px; padding-block: 0 104px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; justify-content: space-between; padding-block: 12px; background: var(--bg); }
.brand { font-family: var(--font-serif); font-size: 21px; letter-spacing: .1em; color: var(--text); text-decoration: none; }
.top nav { display: flex; gap: 4px; }
.top nav a { font-size: 13.5px; color: var(--text-2); text-decoration: none; padding: 6px 10px; border-radius: 999px; }
.top nav a[aria-current="page"] { color: var(--text); background: var(--surface); }
.page { display: grid; gap: 14px; }
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(460px, 100%); display: grid; grid-template-columns: repeat(6, 1fr); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); z-index: 40; }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--text-2); text-decoration: none; font-size: 12px; }
.tabbar a .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
.tabbar a[aria-current="page"] { color: var(--text); }
.tabbar a[aria-current="page"] .dot { background: currentColor; }

.eyebrow { font-size: 12.5px; letter-spacing: .12em; color: var(--text-2); }
.muted { color: var(--text-2); }
.small { font-size: 13.5px; }
.tiny { font-size: 12px; }
.head { display: grid; gap: 4px; padding-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel.flat { background: transparent; border-style: dashed; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; color: var(--text); font-size: 14.5px; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--k-connect); border-color: var(--k-connect); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.chip.blank i { border: 1.5px dashed var(--k-blank-line); }

.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12.5px; color: var(--text-2); }
.field input, .field select, .field textarea { min-height: 42px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); width: 100%; }
.field textarea.code { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

/* Capture: the first thing on the screen */
.capture { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: grid; gap: 12px; }
.capture-main { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
.mic { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); display: grid; place-items: center; cursor: pointer; position: relative; }
.mic svg { width: 26px; height: 26px; }
.mic.on { background: var(--k-connect); }
.mic.on::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--k-connect); opacity: .5; animation: pulse 1.2s ease-out infinite; }
@keyframes pulse { from { transform: scale(.9); opacity: .6; } to { transform: scale(1.15); opacity: 0; } }
.capture textarea { width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); line-height: 1.5; }
.examples { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; max-width: 100%; }
.examples button { flex: none; border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.cap-status { font-size: 13px; color: var(--text-2); }
.cap-status:empty { display: none; }
.cap-status.warn { color: var(--warm); }

.draft { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; background: var(--surface-2); }
.draft.bad { border-color: var(--warm); }
.draft .kinds { display: flex; gap: 4px; flex-wrap: wrap; }
.draft .kinds button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.draft .kinds button i { width: 7px; height: 7px; border-radius: 50%; }
.draft .kinds button[aria-pressed="true"] { border-color: var(--text); color: var(--text); font-weight: 500; }
.draft .times { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.draft .times input[type="date"] { grid-column: 1 / -1; }
.draft input { min-height: 38px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; min-width: 0; font-size: 14px; }
.draft .title { font-size: 15px; flex: 1; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

.hero { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 10px; align-items: center; }
.big { font-size: 44px; line-height: 1.05; }
.big small { font-size: 15px; color: var(--text-2); margin: 0 .2em 0 .1em; font-family: var(--font-sans); }
.dial { width: 112px; height: 112px; }
.dial text { fill: var(--text-2); font-family: var(--font-sans); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.stat .k { font-size: 12.5px; color: var(--text-2); }
.stat .v { font-size: 26px; line-height: 1.2; }
.stat .v small { font-size: 13px; color: var(--text-2); font-family: var(--font-sans); margin: 0 .15em; }

.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 42px; gap: 8px; align-items: center; font-size: 13px; }
.bar-track { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; }
.stackbar { display: flex; height: 16px; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.stackbar span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--text-2); }
.legend b { font-weight: 400; color: var(--text); }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }

.list { display: grid; }
.item { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
.item:last-child { border-bottom: 0; }
.mark { align-self: stretch; border-radius: 3px; min-height: 34px; }
.mark.blank { border: 1.5px dashed var(--k-blank-line); }
.item .t { min-width: 0; overflow-wrap: anywhere; }
.item .when { font-size: 12.5px; color: var(--text-2); }
.gap { padding: 8px 0 8px 16px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--line); }
.x { border: 0; background: transparent; color: var(--text-2); cursor: pointer; min-width: 36px; min-height: 36px; border-radius: 50%; font-size: 18px; line-height: 1; }

.card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: var(--surface); display: grid; gap: 8px; min-width: 0; }
.card.default { border-color: var(--text); }
.notice { border-radius: 14px; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; color: var(--text-2); }
.demo { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 14px; border: 1px dashed var(--warm); color: var(--warm); font-size: 12.5px; }
.quote { font-family: var(--font-serif); font-size: 17px; line-height: 1.7; }
.pending { border-left: 3px solid var(--warm); padding-left: 12px; display: grid; gap: 8px; }
.empty { padding: 18px; text-align: center; color: var(--text-2); border: 1px dashed var(--line); border-radius: 14px; font-size: 13.5px; }
details summary { cursor: pointer; color: var(--text-2); font-size: 13.5px; }

.overlay { position: fixed; inset: 0; background: rgba(13, 17, 19, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet { width: min(460px, 100%); max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet::before { content: ""; width: 40px; height: 4px; border-radius: 4px; background: var(--line); justify-self: center; margin-top: -8px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; z-index: 60; max-width: calc(100% - 32px); }

.charter ol { padding-left: 1.2em; display: grid; gap: 12px; margin: 0; }
.charter li p { color: var(--text-2); font-size: 14px; }
.chain { display: grid; gap: 6px; font-size: 14px; }
.chain div { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.chain b { font-weight: 400; font-family: var(--font-serif); color: var(--text-2); }


/* Adaptive: phone < 720px (single column, bottom tabs) · tablet 720–1099px (wider, two-up cards) · desktop ≥ 1100px (side rail, capture column + overview) */
.col-a, .col-b { display: grid; gap: 14px; min-width: 0; align-content: start; }
.rail-brand { display: none !important; }
@media (min-width: 720px) {
  .app { max-width: 920px; padding-inline: 32px; }
  .tabbar { width: min(920px, 100%); }
  h1 { font-size: 30px; }
  .flow-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .flow-grid > * { grid-column: 1 / -1; }
  .flow-grid > .half { grid-column: auto; }
  .page.split { gap: 16px; }
  .overlay { align-items: center; padding: 24px; }
  .sheet { border-radius: 22px; max-width: 480px; }
  .sheet::before { display: none; }
  .big { font-size: 52px; }
  .hero { grid-template-columns: minmax(0, 1fr) 140px; }
  .dial { width: 140px; height: 140px; }
}
@media (min-width: 1100px) {
  body { padding-left: 104px; }
  .app { max-width: 1200px; padding-inline: 40px; padding-block: 0 48px; }
  .tabbar { top: 0; bottom: 0; left: 0; transform: none; width: 104px; grid-template-columns: 1fr; grid-auto-rows: min-content; gap: 4px; align-content: start; padding: 28px 10px; border-top: 0; border-right: 1px solid var(--line); }
  .tabbar a { padding: 10px 0; border-radius: 12px; font-size: 13px; }
  .tabbar a[aria-current="page"] { background: var(--surface-2); }
  .rail-brand { display: block !important; font-family: var(--font-serif); font-size: 22px; line-height: 1.2; text-align: center; color: var(--text) !important; margin-bottom: 18px; }
  .top .brand { visibility: hidden; }
  .page.split { grid-template-columns: 400px minmax(0, 1fr); align-items: start; column-gap: 24px; }
  .page.split > .head, .page.split > .demo { grid-column: 1 / -1; }
  .col-a { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
  .flow-grid { gap: 20px; }
  .page.flow-grid > .half:only-of-type { grid-column: 1 / -1; }
  .toast { bottom: 32px; }
}
@media (prefers-reduced-motion: reduce) { .mic.on::after { animation: none; } }
@media (prefers-reduced-motion: no-preference) {
  .page { animation: rise .25s ease-out both; }
  @keyframes rise { from { opacity: .5; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>

</div>

<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var KINDS = {
    necessary: { label: '必要', long: '必要时间', color: 'var(--k-nec)' },
    restore: { label: '恢复', long: '恢复时间', color: 'var(--k-restore)' },
    create: { label: '创造', long: '创造时间', color: 'var(--k-create)' },
    connect: { label: '连接', long: '连接时间', color: 'var(--k-connect)' },
    explore: { label: '探索', long: '探索时间', color: 'var(--k-explore)' },
    blank: { label: '留白', long: '留白', color: 'var(--k-blank-line)' }
  };
  var KIND_ORDER = ['necessary', 'create', 'connect', 'explore', 'restore', 'blank'];
  var QUADS = ['restore', 'create', 'connect', 'explore'];
  var USES = { blank: '空着本身', restore: '恢复', create: '创造', connect: '连接', explore: '探索', private: '不想说' };
  var PAGES = [
    { id: 'today', label: '今日' }, { id: 'flow', label: '时间流' }, { id: 'compress', label: '压缩' },
    { id: 'account', label: '账户' }, { id: 'invest', label: '投资' }, { id: 'suggest', label: '建议' }
  ];
  var PAGES2 = [{ id: 'charter', label: '宪章' }, { id: 'settings', label: '设置' }];
  var STORE_KEY = 'leubai.web.v1';

  var RULES = [
    { re: /邮件|email|回复|消息/i, low: 0.3, high: 0.55, method: 'AI 起草常规回复，你只审阅和修改' },
    { re: /会议|纪要|组会|周会|例会|开会/, low: 0.3, high: 0.6, method: '自动转录与要点摘要，会后只核对' },
    { re: /论文|文献|筛选|初筛|材料|审稿/, low: 0.3, high: 0.6, method: 'AI 摘要做初筛，精读留给自己' },
    { re: /报销|行政|表格|填报|审批|整理|申请/, low: 0.2, high: 0.45, method: '模板与自动填表，你只核对提交' },
    { re: /批改|作业|出题/, low: 0.2, high: 0.4, method: 'AI 先做初评与错因归类，你只复核' },
    { re: /通勤|路上|排队/, low: 0, high: 0, method: '这段很难交给 AI，就当作路上的时间' }
  ];
  var DEFAULT_RULE = { low: 0.1, high: 0.3, method: '先记录一周，再判断哪一段适合交给 AI' };

  // keyword → kind, checked in order; the first hit wins
  var KIND_WORDS = [
    ['blank', /留白|空出|空着|什么都不(做|安排)|不安排/],
    ['connect', /陪|家人|朋友|父母|爸|妈|女儿|儿子|孩子|老婆|老公|伴侣|聊天|聚餐|吃饭|打电话|电话|约会|见面/],
    ['restore', /睡|午休|散步|休息|跑步|运动|健身|游泳|瑜伽|冥想|发呆|洗澡|按摩/],
    ['necessary', /会|邮件|回复|报销|行政|审稿|批改|作业|上课|讲课|答疑|通勤|填|申请|汇报|材料|文献筛选|初筛|家务|买菜|消息/],
    ['create', /写|撰写|画|创作|设计|编程|代码|作曲|拍|做研究|实验/],
    ['explore', /读|看书|阅读|学|课程|纪录片|看展|展览|逛|旅行|探索|播客/]
  ];
  function guessKind(s) { for (var i = 0; i < KIND_WORDS.length; i++) if (KIND_WORDS[i][1].test(s)) return KIND_WORDS[i][0]; return 'necessary'; }

  var IDEAS = {
    restore: [['散步', 40], ['什么都不看，坐一会儿', 20], ['午睡', 25], ['慢慢做一顿饭', 60], ['拉伸', 15]],
    create: [['继续写那段一直想写的文字', 60], ['画一页速写', 30], ['把一个想法写成一页纸，不为交付', 40], ['弹一首曲子', 30]],
    connect: [['给父母打个电话', 20], ['约一位朋友吃饭', 90], ['陪家人散步', 45], ['给很久没联系的人写几句话', 15]],
    explore: [['学一节新课程的第一课', 45], ['读与工作无关的书 30 页', 40], ['去一个没去过的街区走走', 60], ['看一部纪录片', 90]]
  };
  var LINES = [
    '不要急于安排新的任务。今天被归还的时间，属于你自己。',
    'AI 负责完成必须做的事，人负责成为想成为的人。',
    '空着的时间不需要理由。',
    '省下的时间，默认不再被塞满。',
    '今天最重要的事是什么？只回答一件就够。',
    '你可以不优化这一天。',
    '请求不是责任，推迟也不是节省。'
  ];
  var EXAMPLES = ['下午两点到三点开组会', '刚才回邮件花了 40 分钟', '晚上八点留白一小时', '明天上午九点半批改作业一个半小时', '六点到七点陪女儿吃饭'];

  // ---------- utils ----------

    return '<div class="item"><span class="mark' + (e.kind === 'blank' ? ' blank' : '') + '" style="' + (e.kind === 'blank' ? '' : 'background:' + KINDS[e.kind].color) + '"></span>' +
      '<div class="t">' + esc(e.title) + '<div class="when"><span class="num">' + e.start + '–' + e.end + '</span> · ' + (e.kind === 'blank' ? blankStatus(e) : KINDS[e.kind].label + ' · ' + fmtPlain(dur(e))) + '</div></div>' +
      (withDelete ? '<button class="x" data-act="del" data-id="' + e.id + '" aria-label="删除 ' + esc(e.title) + '">×</button>' : chip(e.kind)) + '</div>';
  }
  function blankStatus(e) {
    if (e.state === 'reserved') return blankEnded(e) ? '等你确认是否留住' : '已预留，默认不再被塞满' + (e.intent ? ' · 想用来：' + esc(e.intent) : '');
    if (e.state === 'kept') return '完整留住' + (e.use ? ' · ' + USES[e.use] : '') + (e.note ? ' · ' + esc(e.note) : '');
    if (e.state === 'partial') return '留住 ' + fmtPlain(e.kept) + (e.use ? ' · ' + USES[e.use] : '') + (e.note ? ' · ' + esc(e.note) : '');
    if (e.state === 'taken') return '被占用' + (e.note ? ' · ' + esc(e.note) : '');
    return '记不清';
  }

  // capture box + drafts, shared by 今日 and 时间流
  function capture(prompt) {
    var html = '<section class="capture" aria-label="语音或文字记录"><div class="capture-main">' +
      '<button class="mic' + (capState.listening ? ' on' : '') + '" id="mic" data-act="mic" aria-label="按一下开始语音输入" aria-pressed="' + capState.listening + '">' + MIC_SVG + '</button>' +
      '<div><div style="font-family:var(--font-serif);font-size:17px">' + prompt + '</div><div class="tiny muted">说几件事都行，我来拆开、配时间、分好类</div></div></div>' +
      '<form id="capForm" class="stack"><textarea id="cap-text" rows="2" maxlength="600" placeholder="比如：下午两点到三点开组会，刚才回邮件花了 40 分钟，晚上八点留白一小时"></textarea>' +
      '<div class="examples" aria-label="示例">' + EXAMPLES.map(function (x) { return '<button type="button" data-act="ex" data-v="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div>' +
      '<button class="btn primary block" id="capGo" type="submit"' + (capState.busy ? ' disabled' : '') + '>整理</button></form>' +
      '<p id="capStatus" class="cap-status' + (capState.warn ? ' warn' : '') + '" role="status">' + esc(capState.msg) + '</p></section>';
    return html + draftList();
  }
  function draftProblem(d) {
    if (!isHM(d.start) || !isHM(d.end)) return '缺开始或结束时间';
    if (toMin(d.end) <= toMin(d.start)) return '结束要晚于开始';
    if (d.kind !== 'blank' && overlapsBlank(d.date, toMin(d.start), toMin(d.end)).length && !d.force) return 'overlap';
    return '';
  }
  function draftList() {
    if (!S.drafts.length) return '';
    var list = S.drafts.slice();
    if (S.sortBy === 'kind') list.sort(function (a, b) { return KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || ((a.date + a.start) < (b.date + b.start) ? -1 : 1); });
    else list.sort(function (a, b) { var ka = a.date + (a.start || '99'), kb = b.date + (b.start || '99'); return ka < kb ? -1 : ka > kb ? 1 : 0; });
    var nec = S.drafts.filter(function (d) { return d.kind === 'necessary' && ruleFor(d.title).high > 0; });
    var html = '<section class="panel"><div class="row between"><h2>待确认 ' + S.drafts.length + ' 条</h2><div class="seg" role="group" aria-label="排序">' +
      '<button data-act="sort" data-v="time" aria-pressed="' + (S.sortBy === 'time') + '">按时间</button><button data-act="sort" data-v="kind" aria-pressed="' + (S.sortBy === 'kind') + '">按类别</button></div></div>';
    if (nec.length) html += '<p class="small muted">' + nec.map(function (d) { return esc(d.title); }).join('、') + ' 是必要劳动，记下后会出现在“压缩”里。</p>';
    html += list.map(function (d) {
      var prob = draftProblem(d);
      return '<div class="draft' + (prob ? ' bad' : '') + '" data-id="' + d.id + '">' +
        '<div class="row between" style="flex-wrap:nowrap"><input class="title" data-f="title" value="' + esc(d.title) + '" aria-label="事情" maxlength="30"><button class="x" data-act="draft-del" aria-label="删掉这条">×</button></div>' +
        '<div class="kinds" role="group" aria-label="类别">' + KIND_ORDER.map(function (k) { return '<button type="button" data-act="draft-kind" data-v="' + k + '" aria-pressed="' + (d.kind === k) + '"><i style="background:' + (k === 'blank' ? 'transparent;border:1.5px dashed var(--k-blank-line)' : KINDS[k].color) + '"></i>' + KINDS[k].label + '</button>'; }).join('') + '</div>' +
        '<div class="times"><input type="date" data-f="date" value="' + d.date + '" aria-label="日期"><input type="time" data-f="start" value="' + d.start + '" aria-label="开始"><input type="time" data-f="end" value="' + d.end + '" aria-label="结束"></div>' +
        (prob === 'overlap' ? '<div class="row small" style="color:var(--warm)">和你预留的留白重叠，留白默认不被再次塞满。<button class="btn sm" data-act="draft-force">仍然记下</button></div>' : prob ? '<div class="small" style="color:var(--warm)">' + prob + '</div>' : '') +
        '</div>';
    }).join('');
    html += '<div class="two"><button class="btn primary" data-act="draft-commit">全部记下</button><button class="btn" data-act="draft-clear">都不要了</button></div></section>';
    return html;
  }

  // ---------- pages ----------
  function pageToday() {
    var t = todayStr(), today = entriesOn(t), h = new Date().getHours();
    var greet = h < 5 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
    var nec = today.filter(function (e) { return e.kind === 'necessary'; }).reduce(function (a, e) { return a + dur(e); }, 0);
    var free = Math.max(0, S.wake - nec);
    var up = upcomingBlanks(), upMin = up.reduce(function (a, e) { return a + dur(e); }, 0);
    var pend = pendingBlanks(), fi = freedom(inRange(7));
    var html = demoBanner();
    html += '<div class="head"><div class="eyebrow">' + t.replace(/-/g, '.') + ' 星期' + weekday(t) + '</div><h1>' + greet + (S.name ? '，' + esc(S.name) : '') + '</h1></div>';
    html += '<div class="col-a">' + capture('今天怎么过的，说给我听') + '</div><div class="col-b flow-grid">';
    html += '<section class="panel"><div class="hero"><div class="stack" style="gap:4px"><div class="eyebrow">今日可支配生命</div><div class="big">' + fmt(free) + '</div>' +
      '<p class="tiny muted">清醒 ' + Math.round(S.wake / 60) + ' 小时，减去今天的必要时间 ' + fmtPlain(nec) + '</p></div>' + dial(t) + '</div>' +
      '<p class="tiny muted">待办数量已隐藏。没记录的时间，不算空闲也不算浪费。</p></section>';
    if (pend.length) html += '<section class="panel"><h2>这些留白，留住了吗？</h2><p class="small muted">只有你确认留住的，才记进留白账户。被占用了也照实说。</p>' + pend.slice(0, 2).map(confirmBlock).join('') + '</section>';
    html += '<div class="two">' +
      '<div class="stat"><span class="k">今天预留的留白</span><span class="v">' + fmt(upMin) + '</span><button class="btn sm" data-act="reserve" style="justify-self:start;margin-top:6px">预留一段</button></div>' +
      '<div class="stat"><span class="k">今日已确认节省</span><span class="v">' + fmt(trialsSaved(t)) + '</span><span class="tiny muted">试过才算，不是估算</span></div>' +
      '</div>';
    html += '<div class="stat half"><span class="k">本周自由指数</span><div class="row" style="gap:12px;flex-wrap:nowrap"><span class="v num">' + (fi ? fi.score : '—') + '</span><span class="tiny muted" style="min-width:0">' + (fi ? '自主时间 ' + pct(fi.auto) + '%，其中创造与连接 ' + pct(fi.meaning) + '%。只描述，不比较。' : '记满一小时后才计算。') + '</span></div></div>';
    html += '<section class="panel flat half"><div class="eyebrow">一句提醒</div><p class="quote">' + esc(LINES[hashInt(t) % LINES.length]) + '</p></section>';
    var shown = today.filter(function (e) { return e.kind !== 'blank' || e.state === 'reserved'; });
    html += '<section class="panel"><div class="row between"><h2>今天</h2><a class="small" href="#flow">全部</a></div>' +
      (shown.length ? '<div class="list">' + shown.slice(-5).map(function (e) { return timeItem(e, false); }).join('') + '</div>' : '<div class="empty">还没有记录。按上面的话筒说一句就行。</div>') + '</section>';
    return html + '</div>';
  }

  function confirmBlock(e) {
    var d = dur(e);
    return '<div class="pending" data-id="' + e.id + '"><div class="small"><b>' + esc(dateLabel(e.date)) + ' ' + e.start + '–' + e.end + '</b> <span class="muted">' + fmtPlain(d) + (e.intent ? ' · 想用来：' + esc(e.intent) : '') + '</span></div>' +
      '<div class="seg" role="group" aria-label="这段留白的结果"><button data-act="c-state" data-v="kept">完整留住</button><button data-act="c-state" data-v="partial">留住一部分</button><button data-act="c-state" data-v="taken">被占用了</button><button data-act="c-state" data-v="unknown">记不清</button></div>' +
      '<div class="c-more stack" hidden><div class="field c-partial" hidden><label for="kp-' + e.id + '">留住了多少分钟</label><input id="kp-' + e.id + '" type="number" inputmode="numeric" min="1" max="' + d + '" value="' + Math.round(d / 2) + '"></div>' +
      '<div class="field c-use"><label for="ku-' + e.id + '">用在了哪里（可不选）</label><select id="ku-' + e.id + '"><option value="">不选</option>' + Object.keys(USES).map(function (k) { return '<option value="' + k + '">' + USES[k] + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="kn-' + e.id + '">一句话（可不写）</label><input id="kn-' + e.id + '" maxlength="60" placeholder="比如：陪女儿散步"></div>' +
      '<button class="btn sm primary" data-act="c-save" style="justify-self:start">记下</button></div></div>';
  }

  var flowDate = null;
  function pageFlow() {
    var date = flowDate || todayStr(), list = entriesOn(date), x = mix(list);
    var html = demoBanner();
    html += '<div class="head"><div class="eyebrow">时间流</div><h1>' + esc(dateLabel(date)) + '的时间</h1></div>';
    html += '<div class="col-a">' + capture('补记一段时间') + '</div><div class="col-b flow-grid">';
    html += '<div class="row between"><button class="btn sm" data-act="day" data-d="-1">‹ 前一天</button><span class="num small">' + date.replace(/-/g, '.') + ' 周' + weekday(date) + '</span><button class="btn sm" data-act="day" data-d="1">后一天 ›</button></div>';
    if (date !== todayStr()) html += '<button class="btn sm ghost" data-act="day" data-d="0" style="justify-self:center">回到今天</button>';
    html += '<section class="panel half"><div class="list">';
    if (!list.length) html += '<div class="empty">这一天还没有记录。</div>';
    var prevEnd = null;
    list.forEach(function (e) {
      if (prevEnd !== null && toMin(e.start) - prevEnd >= 60) html += '<div class="gap">' + toHM(prevEnd) + '–' + e.start + ' 没有记录，不认定为空闲</div>';
      prevEnd = Math.max(prevEnd || 0, toMin(e.end));
      html += timeItem(e, true);
    });
    html += '</div><details><summary>手动添加一段</summary><form id="addForm" class="stack" style="margin-top:10px">' +
      '<div class="field"><label for="f-title">做了什么</label><input id="f-title" required maxlength="30" placeholder="邮件回复、论文阅读、晚餐与聊天"></div>' +
      '<div class="field"><label for="f-kind">属于</label><select id="f-kind">' + ['necessary', 'restore', 'create', 'connect', 'explore'].map(function (k) { return '<option value="' + k + '">' + KINDS[k].long + '</option>'; }).join('') + '</select></div>' +
      '<div class="two"><div class="field"><label for="f-start">开始</label><input id="f-start" type="time" required value="09:00"></div><div class="field"><label for="f-end">结束</label><input id="f-end" type="time" required value="10:00"></div></div>' +
      '<p id="addWarn" class="small" style="color:var(--warm)" hidden></p><button class="btn primary" type="submit">记下</button></form></details></section>';
    html += '<section class="panel half"><h2>当天时间地图</h2>' + (x.total ? bars(x.m, KIND_ORDER, x.total) : '<div class="empty">记录之后显示比例。</div>') + '</section>';
    return html + '</div>';
  }

  function pageCompress() {
    var finds = compressFindings(7), t = todayStr();
    var lowSum = finds.reduce(function (a, f) { return a + f.low; }, 0), highSum = finds.reduce(function (a, f) { return a + f.high; }, 0);
    var savedToday = trialsSaved(t);
    var html = demoBanner();
    html += '<div class="head"><div class="eyebrow">AI 压缩</div><h1>必要劳动里，哪些可以交给 AI</h1><p class="small muted">只看你记下的必要时间。估算是区间；你试过、记下前后用时，节省才算数。</p></div>';
    html += '<div class="two"><div class="stat"><span class="k">每天估算可压缩</span><span class="v num">' + lowSum + '–' + highSum + '<small>分钟</small></span></div>' +
      '<div class="stat"><span class="k">今天已确认节省</span><span class="v">' + fmt(savedToday) + '</span></div></div>';
    html += '<button class="btn primary block" data-act="reserve" data-min="' + (savedToday || 30) + '">把省下的时间留白</button>';
    html += '<section class="panel half"><h2>本周发现</h2>' + (finds.length ? '<div class="list">' + finds.map(function (f) {
      return '<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><div class="t">' + esc(f.title) + ' <span class="tiny muted">每天约 ' + f.perDay + ' 分钟</span>' +
        '<div class="when">' + (f.high ? '可压缩约 <span class="num">' + f.low + '–' + f.high + '</span> 分钟 · ' : '') + esc(f.method) + '</div></div>' +
        (f.high ? '<button class="btn sm" data-act="trial" data-title="' + esc(f.title) + '" data-before="' + f.perDay + '">试过了</button>' : '') + '</div>';
    }).join('') + '</div>' : '<div class="empty">还没有必要时间。在首页说一句“上午开了一小时会”试试。</div>') + '</section>';
    html += '<section class="panel half"><h2>试过的记录</h2>' + (S.trials.length ? '<div class="list">' + S.trials.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (r) {
      return '<div class="item" style="grid-template-columns:minmax(0,1fr) auto auto"><div class="t">' + esc(r.title) + '<div class="when">' + esc(dateLabel(r.date)) + ' · ' + r.before + ' → ' + r.after + ' 分钟' + (r.method ? ' · ' + esc(r.method) : '') + '</div></div><span class="num">−' + Math.max(0, r.before - r.after) + '</span><button class="x" data-act="del-trial" data-id="' + r.id + '" aria-label="删除这条">×</button></div>';
    }).join('') + '</div>' : '<div class="empty">还没有。</div>') + '<p class="tiny muted">核对、修改 AI 输出的时间，也算进“用 AI 后”。</p></section>';

  }

  function pageAccount() {
    var total = keptTotal(), blanks = S.entries.filter(function (e) { return e.kind === 'blank'; });
    var by = { blank: 0, restore: 0, create: 0, connect: 0, explore: 0, private: 0 };
    blanks.forEach(function (e) { if (e.kept) by[e.use || 'private'] += e.kept; });
    var cnt = { kept: 0, partial: 0, taken: 0, unknown: 0, reserved: 0 };
    blanks.forEach(function (e) { cnt[e.state] = (cnt[e.state] || 0) + 1; });
    var recent = blanks.filter(function (e) { return e.kept > 0; }).sort(function (a, b) { return (a.date + a.start) < (b.date + b.start) ? 1 : -1; })[0];
    var html = demoBanner();
    html += '<div class="head"><div class="eyebrow">留白账户</div><h1>你留住的人生时间</h1></div>';
    html += '<section class="panel half"><div class="eyebrow">累计留住</div><div class="big">' + fmt(total) + '</div><p class="small muted">相当于 <span class="num">' + (total / 1440).toFixed(1) + '</span> 天连续的人生。只算你亲口确认留住的。</p></section>';
    if (recent) html += '<section class="panel half"><div class="eyebrow">最近一次</div><div class="row"><span class="big" style="font-size:30px">' + fmt(recent.kept) + '</span><span class="small muted">' + esc(dateLabel(recent.date)) + (recent.use ? ' · ' + USES[recent.use] : '') + '</span></div>' + (recent.note ? '<p class="quote">' + esc(recent.note) + '</p>' : '') + '</section>';
    html += '<section class="panel half"><h2>去了哪里</h2>' + (total ? '<div class="bars">' + Object.keys(by).filter(function (k) { return by[k] > 0; }).sort(function (a, b) { return by[b] - by[a]; }).map(function (k) {
      var c = k === 'blank' || k === 'private' ? 'var(--k-blank-line)' : KINDS[k].color;
      return '<div class="bar-row" style="grid-template-columns:62px minmax(0,1fr) 70px"><span>' + USES[k] + '</span><div class="bar-track"><div class="bar-fill" style="width:' + (by[k] / total * 100).toFixed(1) + '%;background:' + c + '"></div></div><span class="num tiny" style="text-align:right">' + fmtPlain(by[k]) + '</span></div>';
    }).join('') + '</div><p class="tiny muted">“空着本身”和其他用途一样算数。</p>' : '<div class="empty">还没有确认留住的留白。</div>') + '</section>';
    html += '<section class="panel half"><h2>如实的账</h2><div class="two" style="grid-template-columns:repeat(3,1fr)">' +
      [['预留过', blanks.length], ['完整留住', cnt.kept], ['留住部分', cnt.partial], ['被占用', cnt.taken], ['记不清', cnt.unknown], ['还没到', cnt.reserved]].map(function (p) { return '<div><div class="num" style="font-size:24px">' + p[1] + '</div><div class="tiny muted">' + p[0] + '</div></div>'; }).join('') +
      '</div><p class="small muted">被占用的那几次，说明边界在哪里还薄。它是信息，不是失败。</p></section>';
    return html;
  }

  var investRange = 30;
  function pageInvest() {
    var x = mix(inRange(investRange)), m = x.m;
    var html = demoBanner();
    html += '<div class="head"><div class="eyebrow">人生投资</div><h1>像看投资组合一样看时间</h1><p class="small muted">理想比例由你自己定，留白不提供标准答案，也不打分。</p></div>';
    html += '<div class="seg" role="group" aria-label="时间范围">' + [7, 30, 90].map(function (d) { return '<button data-act="range" data-d="' + d + '" aria-pressed="' + (investRange === d) + '">' + d + ' 天</button>'; }).join('') + '</div>';
    if (!x.total) return html + '<div class="empty">这个范围内还没有记录。</div>';
    var keys = ['create', 'connect', 'explore', 'restore', 'necessary', 'blank'].filter(function (k) { return m[k] > 0; });
    html += '<section class="panel half"><h2>实际组合</h2><div class="stackbar" role="img" aria-label="' + keys.map(function (k) { return KINDS[k].label + pct(m[k] / x.total) + '%'; }).join('，') + '">' + keys.map(function (k) { return '<span style="width:' + (m[k] / x.total * 100).toFixed(2) + '%;background:' + KINDS[k].color + '"></span>'; }).join('') + '</div>' +
      '<div class="legend">' + keys.map(function (k) { return '<span><i style="background:' + KINDS[k].color + '"></i>' + KINDS[k].label + ' <b class="num">' + pct(m[k] / x.total) + '%</b></span>'; }).join('') + '</div><p class="tiny muted">基于你记录的 ' + fmtPlain(x.total) + '</p></section>';
    var ideal = S.ideal;
    html += '<section class="panel half"><div class="row between"><h2>你想要的比例</h2><button class="btn sm" data-act="ideal-edit">' + (ideal ? '修改' : '设定') + '</button></div>';
    if (!ideal) html += '<p class="small muted">还没设定。只在恢复、创造、连接、探索之间分配，不含必要劳动。</p>';
    else {
      var qt = QUADS.reduce(function (a, k) { return a + m[k]; }, 0) || 1;
      var rows = QUADS.map(function (k) { var a = m[k] / qt * 100; return { k: k, a: a, i: ideal[k], d: a - ideal[k] }; });
      html += '<div class="list">' + rows.map(function (r) {
        return '<div class="item" style="grid-template-columns:56px minmax(0,1fr) 40px">' + chip(r.k) + '<div class="stack" style="gap:4px"><div class="bar-track"><div class="bar-fill" style="width:' + Math.min(100, r.a).toFixed(1) + '%;background:' + KINDS[r.k].color + '"></div></div><div class="bar-track" style="height:5px"><div class="bar-fill" style="width:' + r.i + '%;background:var(--text-2);opacity:.45"></div></div></div>' +
          '<span class="num small" style="text-align:right;color:' + (r.d < -5 ? 'var(--warm)' : 'var(--text-2)') + '">' + (r.d > 0 ? '+' : '') + Math.round(r.d) + '</span></div>';
      }).join('') + '</div><p class="tiny muted">上面一条是实际，下面虚线是你想要的；数字是差几个百分点。</p>';
      var gap = rows.slice().sort(function (a, b) { return a.d - b.d; })[0];

    if (f.id === 'addForm') {

      var st = document.getElementById('f-start').value, en = document.getElementById('f-end').value, w = document.getElementById('addWarn');
      if (!title || !st || !en) return;
      if (toMin(en) <= toMin(st)) { w.hidden = false; w.textContent = '结束要晚于开始。跨午夜的时间请分成两段。'; return; }
      var entry = { id: uid(), date: date, start: st, end: en, title: title, kind: kind };
      var hit = overlapsBlank(date, toMin(st), toMin(en));
      if (hit.length) { pendingAdd = entry; w.hidden = false; w.innerHTML = '和预留的留白重叠，留白默认不被再次塞满。 <button class="btn sm" type="button" data-act="add-anyway">仍然记下</button>'; return; }
      S.entries.push(entry); save(); render(); toast('记下了：' + title); return;
    }
    if (f.id === 'setForm') {
      S.name = document.getElementById('s-name').value.trim();
      var wk = +document.getElementById('s-wake').value; if (wk >= 8 && wk <= 20) S.wake = Math.round(wk * 60);
      save(); render(); toast('已保存'); return;
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && document.querySelector('.overlay')) closeSheet();
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.target.id === 'cap-text') { ev.preventDefault(); parseInput(ev.target.value); }
  });
  document.addEventListener('input', function (ev) { if (ev.target.id && ev.target.id.indexOf('i-') === 0) updateIdealSum(); });
  window.addEventListener('hashchange', function () { capState.msg = ''; render(); window.scrollTo(0, 0); });

  // test hook for the local parser (pure, no side effects)
  window.__leubaiParse = ruleParse;

  render();
  if (!S.mode) onboard();
})();
</script>
